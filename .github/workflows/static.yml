  if(el&&src) el.innerText=src.innerText||'1';
}

// ─── flip logic ────────────────────────────
function cfDoFlip(){
  if(_busy) return;
  _busy=true;
  _playFlip();

  var btn=document.getElementById('cfFlipBtn');
  if(btn){ btn.disabled=true; btn.innerText=t('flipping'); }

  var rm=document.getElementById('cfResultMain');
  if(rm){ rm.innerText=''; rm.className='cf-result-main'; rm.dataset.result=''; }
  var rs=document.getElementById('cfResultSub');
  if(rs) rs.innerText='';

  var ring=document.getElementById('cfGlowRing');
  if(ring) ring.className='cf-coin-glow-ring';

  var coin=document.getElementById('cfCoin');
  if(coin){ coin.classList.remove('cf-spinning'); void coin.offsetWidth; coin.classList.add('cf-spinning'); }

  var isHeads=Math.random()<0.5;

  setTimeout(function(){
    var result=isHeads?'heads':'tails';
    var label=isHeads?t('heads'):t('tails');

    if(rm){ rm.innerText=label; rm.className='cf-result-main '+(isHeads?'rh':'rt'); rm.dataset.result=result; }
    if(rs) rs.innerText=t('flipAgain');
    if(ring) ring.className='cf-coin-glow-ring glow-'+result;

    if(btn){ btn.disabled=false; btn.innerText=t('flipBtn'); }
    _busy=false;
    _playResult(isHeads);

    var now=new Date();
    _hist.unshift({
      result:result,
      time:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
      date:now.toLocaleDateString([],{day:'2-digit',month:'2-digit',year:'2-digit'})
    });
    if(_hist.length>100) _hist=_hist.slice(0,100);
    localStorage.setItem(CF_HIST_KEY,JSON.stringify(_hist));
    _renderHistory();
    _updateStats();
  },1250);
}
window.cfDoFlip=cfDoFlip;

// ─── history ───────────────────────────────
function _renderHistory(){
  var list=document.getElementById('cfHistList');
  if(!list) return;
  if(!_hist.length){
    list.innerHTML='<div class="cf-hist-empty">'+t('noFlips')+'</div>';
    return;
  }
  var html='';
  for(var i=0;i<_hist.length;i++){
    var e=_hist[i];
    var isH=e.result==='heads';
    var lbl=isH?t('heads'):t('tails');
    var shr=isH?t('hs'):t('ts');
    html+='<div class="cf-hist-item">'+
      '<div class="cf-hist-num">'+(i+1)+'</div>'+
      '<div class="cf-hist-icon '+e.result+'">'+shr+'</div>'+
      '<div class="cf-hist-label '+e.result+'">'+lbl+'</div>'+
      '<div class="cf-hist-time">'+e.time+'<br>'+e.date+'</div>'+
      '</div>';
  }
  list.innerHTML=html;
}

function cfClearHistory(){
  _playClick();
  _hist=[];
  localStorage.setItem(CF_HIST_KEY,JSON.stringify(_hist));
  _renderHistory();
  _updateStats();
}
window.cfClearHistory=cfClearHistory;

// ─── stats ─────────────────────────────────
function _updateStats(){
  var h=0,tails=0;
  _hist.forEach(function(e){ if(e.result==='heads') h++; else tails++; });
  var eh=document.getElementById('cfStatH');
  var et=document.getElementById('cfStatT');
  if(eh) eh.innerText=h;
  if(et) et.innerText=tails;
}

// ─── click-outside to close ────────────────
document.addEventListener('click',function(e){
  var m=document.getElementById('cfModal');
  if(m&&m.style.display==='flex'&&e.target===m) cfClose();
});

// ─── online count mirror ───────────────────
var _onlineObs=new MutationObserver(function(){
  if(document.getElementById('cfModal').style.display==='flex') _syncOnline();
});
document.addEventListener('DOMContentLoaded',function(){
  var src=document.getElementById('onlineCountDisplay');
  if(src) _onlineObs.observe(src,{childList:true,characterData:true,subtree:true});
});

// ─── init ──────────────────────────────────
_applyLang();

})();

</script>

