/* ========================================== */
/*   BACKGROUND LIBRARY                        */
/* ========================================== */
#backgroundLibraryModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10020;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(2, 0, 4, .78);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
}
.background-library-panel {
    position: relative;
    width: min(960px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 26px 24px 22px;
    box-sizing: border-box;
    border-radius: 20px;
    border: 1px solid rgba(255, 70, 70, .62);
    background: linear-gradient(145deg, rgba(48, 5, 9, .98), rgba(25, 2, 5, .99));
    box-shadow: 0 24px 70px rgba(0,0,0,.82), 0 0 24px rgba(255, 42, 42, .16);
    animation: backgroundLibraryIn .28s cubic-bezier(.2,.9,.3,1.18);
}
@keyframes backgroundLibraryIn {
    from { opacity: 0; transform: translateY(18px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.background-library-panel::-webkit-scrollbar { width: 6px; }
.background-library-panel::-webkit-scrollbar-thumb { background: #7b2027; border-radius: 8px; }
.background-library-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
}
.background-library-title {
    margin: 0;
    color: #fff;
    font-family: Impact, sans-serif;
    font-size: clamp(34px, 5vw, 48px);
    line-height: .95;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.background-library-subtitle {
    margin: 8px 0 0;
    color: rgba(255,255,255,.57);
    font: 11px Arial, sans-serif;
    font-weight: bold;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}
.background-library-close {
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06);
    color: #fff;
    font: bold 22px Arial, sans-serif;
    cursor: pointer;
    transition: background .18s, transform .18s, border-color .18s;
}
.background-library-close:hover,
.background-library-close:focus-visible {
    background: rgba(255, 70, 70, .26);
    border-color: rgba(255, 110, 110, .75);
    transform: rotate(90deg);
    outline: none;
}
.background-library-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,.1);
}
.background-library-filter {
    padding: 9px 16px;
    border-radius: 22px;
    border: 1px solid rgba(255, 70, 70, .75);
    background: rgba(172, 18, 28, .38);
    color: #fff;
    font: bold 12px Arial, sans-serif;
}
.background-library-count {
    color: rgba(255,255,255,.43);
    font: 11px Arial, sans-serif;
    font-weight: bold;
    letter-spacing: .5px;
    text-transform: uppercase;
}
.background-library-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 24px 16px;
    padding-top: 20px;
}
.background-library-card {
    min-width: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: white;
    text-align: center;
    cursor: pointer;
}
.background-library-thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1.78 / 1;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.17);
    background: #130d10;
    box-shadow: 0 6px 18px rgba(0,0,0,.42);
    transition: transform .18s, border-color .18s, box-shadow .18s;
}
.background-library-card:hover .background-library-thumb,
.background-library-card:focus-visible .background-library-thumb {
    transform: translateY(-3px);
    border-color: rgba(255, 126, 126, .85);
    box-shadow: 0 9px 24px rgba(0,0,0,.55);
}
.background-library-card.selected .background-library-thumb {
    border: 3px solid #ff4747;
    box-shadow: 0 0 0 1px rgba(255,255,255,.22) inset, 0 0 16px rgba(255, 42, 42, .5);
}
.background-library-name {
    display: block;
    margin-top: 9px;
    color: rgba(255,255,255,.9);
    font: bold 13px Arial, sans-serif;
    line-height: 1.15;
    text-transform: none;
}
.background-library-current {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 24px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 11px;
    background: rgba(0,0,0,.16);
    color: rgba(255,255,255,.58);
    font: 10px Arial, sans-serif;
    font-weight: bold;
    letter-spacing: .7px;
    text-transform: uppercase;
}
.background-library-current-name {
    display: block;
    margin-top: 4px;
    color: #fff;
    font-size: 13px;
    letter-spacing: .2px;
}
.background-library-selected-label {
    color: #a9e5be;
    white-space: nowrap;
}
.background-library-empty {
    grid-column: 1 / -1;
    padding: 36px 16px;
    color: rgba(255,255,255,.58);
    text-align: center;
    font: 13px Arial, sans-serif;
}
@media (max-width: 800px) {
    .background-library-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 480px) {
    .background-library-panel { padding: 22px 14px 16px; border-radius: 16px; }
    .background-library-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; }
    .background-library-toolbar { margin-top: 18px; }
    .background-library-current { align-items: flex-start; flex-direction: column; gap: 8px; }
}

.dice-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; min-height: 95px; }
