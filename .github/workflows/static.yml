#adminModal, #verifyModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10000; align-items: center; justify-content: center; }
.admin-content, .verify-content { background: url("background.gif.gif") repeat; background-color: #121212; border: 4px solid white; border-radius: 20px; width: 90%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 30px; box-sizing: border-box; text-align: left; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
