// --- Renders the searchable / filterable VIP players grid ---
function renderVipManagerList() {
    const container = document.getElementById("vipPlayersContainer");
    if (!container) return;
    const searchInput = document.getElementById("vipSearchInput");
    const searchTerm = searchInput ? searchInput.value.trim().toUpperCase() : "";

    const ids = Object.keys(vipPlayers);
    document.getElementById("vipCountPill").innerText = `${ids.length} player${ids.length === 1 ? '' : 's'}`;

    let entries = ids.map(id => ({ id, ...vipPlayers[id], status: getVipStatus(vipPlayers[id]) }));

    if (vipCurrentFilter !== 'all') { entries = entries.filter(e => e.status === vipCurrentFilter); }

    if (searchTerm) {
        entries = entries.filter(e =>
            e.id.toUpperCase().includes(searchTerm) ||
            (e.username || "").toUpperCase().includes(searchTerm)
        );
    }

    entries.sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0));

    container.innerHTML = "";
    if (entries.length === 0) {
        container.innerHTML = "<div class='vip-empty-state'>⭐ No VIP players found.</div>";
        return;
    }

    entries.forEach(e => {
        const card = document.createElement("div");
        card.className = `vip-player-card ${e.status}`;
        const statusLabel = e.status.charAt(0).toUpperCase() + e.status.slice(1);
        const expiryText = e.status === 'permanent' ? 'Never' : formatVipDate(e.expiresAt);
        card.innerHTML = `
            <div class="vip-card-top">
                <span class="vip-card-username">${e.username && e.username.trim() ? e.username : e.id}</span>
                <span class="vip-status-badge ${e.status}">${statusLabel}</span>
            </div>
            <div class="vip-card-id">🆔 ${e.id}</div>
            <div class="vip-card-row"><span>Date Added</span><b>${formatVipDate(e.dateAdded)}</b></div>
            <div class="vip-card-row"><span>Expires</span><b>${expiryText}</b></div>
            <div class="vip-card-actions">
                <button class="vip-btn-edit" onclick="openEditVipModal('${e.id}')">✏️ EDIT</button>
                <button class="vip-btn-remove" onclick="removeVipPlayer('${e.id}')">🗑️ REMOVE</button>
            </div>
        `;
        container.appendChild(card);
    });
}

