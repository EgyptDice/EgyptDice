  if(btn&&!_busy) btn.innerText=t('flipBtn');
  var sub=document.getElementById('cfResultSub');
  if(sub&&!_busy){
    var rm=document.getElementById('cfResultMain');
    if(rm&&!rm.innerText) sub.innerText=t('tapHint');
  }
  // re-render result text if showing
  var rm2=document.getElementById('cfResultMain');
  if(rm2&&rm2.dataset.result){
    rm2.innerText=rm2.dataset.result==='heads'?t('heads'):t('tails');
  }
}

