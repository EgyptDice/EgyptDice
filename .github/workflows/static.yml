  s('cfClearBtn',    t('clear'));
  s('cfOnlineTxt',   t('online')+':');
  s('cfLabelH',      t('hs'));
  s('cfLabelT',      t('ts'));
  s('cfStatHLbl',    t('headsLbl'));
  s('cfStatTLbl',    t('tailsLbl'));
