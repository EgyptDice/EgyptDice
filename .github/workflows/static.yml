    display: none;
    color: rgba(255, 174, 166, .72);
    font: 10px Arial, sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.brainrot-title {
    margin: 0;
    color: #ffe7de;
    font: 19px Impact, sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255, 63, 72, .24);
}
.brainrot-close {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
    border-radius: 50%;
    color: #ffaaa1;
    border: 1px solid rgba(255, 104, 103, .3);
    background: rgba(255, 255, 255, .05);
    font: 15px Impact, sans-serif;
    cursor: pointer;
    transition: background .18s, transform .18s, color .18s;
}
.brainrot-close:hover { color: #fff; background: rgba(255, 71, 71, .2); transform: rotate(90deg); }
.brainrot-stats {
    position: absolute;
    top: 6px;
    right: 36px;
    width: 158px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    margin: 0;
}
.brainrot-stat {
    min-width: 0;
    padding: 6px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
.brainrot-stat-label {
    display: block;
    margin-bottom: 1px;
    font: 9px Impact, sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.brainrot-stat.won .brainrot-stat-label, .brainrot-stat.won .brainrot-stat-value { color: #ff9585; }
.brainrot-stat.lost .brainrot-stat-label, .brainrot-stat.lost .brainrot-stat-value { color: #d78390; }
.brainrot-stat-value {
    display: block;
    font: 17px Impact, sans-serif;
    letter-spacing: .7px;
}
.brainrot-main {
    display: contents;
}
.brainrot-visual {
    grid-column: 1;
    grid-row: 2;
    min-height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255, 102, 101, .24);
    background: radial-gradient(circle at 50% 40%, rgba(255, 97, 90, .21), rgba(32, 8, 15, .28) 58%, rgba(8, 8, 13, .48));
}
.brainrot-visual::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(255, 140, 128, .13);
    border-radius: 9px;
    pointer-events: none;
}
.brainrot-image {
    width: 88%;
    height: 88px;
    object-fit: contain;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 13px 18px rgba(0,0,0,.55));
    transition: opacity .18s, transform .22s;
}
.brainrot-visual:hover .brainrot-image { transform: scale(1.035); }
.brainrot-details {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
}
.brainrot-selected-name {
    margin: 0;
    color: #fff0e9;
    font: 15px Impact, sans-serif;
    letter-spacing: .55px;
    line-height: 1.1;
    text-transform: uppercase;
}
.brainrot-field-label {
    display: block;
    margin-bottom: 3px;
    color: rgba(255, 204, 198, .58);
    font: 8px Arial, sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.brainrot-select {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 8px;
    border: 1px solid rgba(255, 101, 101, .35);
    border-radius: 9px;
    outline: none;
    color: #ffe7df;
    background: rgba(23, 7, 13, .9);
    font: 11px Arial, sans-serif;
    cursor: pointer;
}
.brainrot-select:focus { border-color: #ff817a; box-shadow: 0 0 0 3px rgba(255, 74, 74, .13); }
.brainrot-select option { color: #ffe7df; background: #241017; }
.brainrot-counter {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 42px;
    padding: 3px 8px;
    color: #fff1e7;
    font: 31px Impact, sans-serif;
    letter-spacing: 1px;
    text-shadow: 0 0 22px rgba(255, 74, 74, .38);
    border: 1px solid rgba(255, 95, 94, .28);
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(255, 91, 84, .13), rgba(22, 7, 13, .5));
}
.brainrot-counter.is-negative { color: #e7a2ab; text-shadow: 0 0 22px rgba(205, 72, 94, .33); }
.brainrot-controls {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
}
.brainrot-control {
    min-height: 28px;
    border: 1px solid rgba(255, 117, 111, .33);
    border-radius: 8px;
    color: #ffd9d0;
    background: rgba(255, 84, 82, .1);
    font: 11px Impact, sans-serif;
    letter-spacing: .45px;
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .16s;
}
.brainrot-control:hover { background: rgba(255, 86, 82, .22); border-color: rgba(255, 141, 133, .68); transform: translateY(-1px); }
.brainrot-control:active { transform: scale(.95); }
.brainrot-info {
    grid-column: 3;
    grid-row: 2;
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    align-content: center;
    margin-top: 0;
}
.brainrot-info-box {
    padding: 7px 8px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, .1);
    background: rgba(255, 255, 255, .035);
}
.brainrot-info-box.won { border-color: rgba(255, 112, 99, .28); }
.brainrot-info-box.lost { border-color: rgba(188, 92, 110, .28); }
.brainrot-info-title {
    margin: 0 0 3px;
    color: #ffb4a8;
    font: 10px Impact, sans-serif;
    letter-spacing: .25px;
    line-height: 1.25;
}
.brainrot-info-box.lost .brainrot-info-title { color: #d89aa5; }
.brainrot-info-copy {
    margin: 0;
    color: rgba(255, 226, 219, .5);
    font: 9px Arial, sans-serif;
    letter-spacing: .2px;
}
.brainrot-help {
    grid-column: 1 / -1;
    margin: 6px 0 0;
    color: rgba(255, 220, 215, .4);
    font: 8px Arial, sans-serif;
    letter-spacing: .45px;
    text-align: center;
    text-transform: uppercase;
}
@media (max-width: 680px) {
    .brainrot-panel {
        padding: 10px;
        border-radius: 14px;
        grid-template-columns: 78px minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto auto;
    }
    .brainrot-panel-header { padding-right: 154px; }
    .brainrot-stats { right: 38px; width: 145px; }
    .brainrot-visual { min-height: 92px; }
    .brainrot-image { height: 86px; }
    .brainrot-title { font-size: 17px; }
    .brainrot-info {
        grid-column: 1 / -1;
        grid-row: 3;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 0;
    }
    .brainrot-help { grid-row: 4; }
}
@media (max-width: 480px) {
    .brainrot-topbar-btn { padding: 5px 9px 5px 7px; font-size: 11px; }
    .brainrot-glyph { width: 18px; height: 18px; font-size: 9px; }
    .brainrot-stats, .brainrot-info { gap: 5px; }
    .brainrot-panel-header { padding-right: 132px; }
    .brainrot-stats { right: 36px; width: 122px; }
    .brainrot-stat { padding: 6px 8px; }
    .brainrot-counter { min-height: 42px; font-size: 30px; }
    .brainrot-info-title { font-size: 9px; }
    .brainrot-info-copy { font-size: 8px; }
}
</style>
</head>

