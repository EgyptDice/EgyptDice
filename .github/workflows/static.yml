    noFlips:'\u041D\u044F\u043C\u0430 \u0445\u0432\u044A\u0440\u043B\u044F\u043D\u0438\u044F.',
    clear:'\uD83D\uDDD1 \u0418\u0417\u0427\u0418\u0421\u0422\u0418',
    headsLbl:'\u0415\u0417\u0418', tailsLbl:'\u0422\u0423\u0420\u0410'
  }
};

var _lang    = localStorage.getItem(CF_LANG_KEY) || 'en';
var _hist    = [];
var _busy    = false;
var _audioCtx= null;

try { _hist = JSON.parse(localStorage.getItem(CF_HIST_KEY) || '[]'); } catch(e) { _hist=[]; }

function t(k){ return (TR[_lang]&&TR[_lang][k]) ? TR[_lang][k] : TR.en[k]; }

// ─── audio ─────────────────────────────────
function _audio(){
  if(!_audioCtx){
    try { _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  }
  return _audioCtx;
}
function _playFlip(){
  var ctx = _audio(); if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume();
  var dur = 1.15;
  var buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  var d   = buf.getChannelData(0);
  for(var i=0;i<d.length;i++){
    var t2=i/ctx.sampleRate;
    var env=Math.exp(-3.6*t2) * (0.72 + 0.28*Math.sin(2*Math.PI*7*t2));
    var shimmer=Math.sin(2*Math.PI*(420+950*t2)*t2);
    var texture=(Math.random()*2-1) * 0.18;
    d[i]=(shimmer*0.7 + texture)*env*0.42;
  }
  var src=ctx.createBufferSource();
  src.buffer=buf;
  var bpf=ctx.createBiquadFilter();
  bpf.type='bandpass'; bpf.frequency.value=1450; bpf.Q.value=2.2;
  var gain=ctx.createGain();
  gain.gain.value=0.68;
  src.connect(bpf); bpf.connect(gain); gain.connect(ctx.destination);
  src.start();

  var t0=ctx.currentTime;
  [740, 988, 1318].forEach(function(freq,i){
    var osc=ctx.createOscillator();
    var toneGain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(freq,t0+i*0.18);
    osc.frequency.exponentialRampToValueAtTime(freq*1.16,t0+i*0.18+0.16);
    toneGain.gain.setValueAtTime(0,t0+i*0.18);
    toneGain.gain.linearRampToValueAtTime(0.085,t0+i*0.18+0.025);
    toneGain.gain.exponentialRampToValueAtTime(0.001,t0+i*0.18+0.28);
    osc.connect(toneGain); toneGain.connect(ctx.destination);
    osc.start(t0+i*0.18); osc.stop(t0+i*0.18+0.3);
  });
}
function _playResult(isHeads){
  var ctx=_audio(); if(!ctx) return;
  var notes=isHeads ? [523,659,784,1047] : [523,440,349,294];
  var t0=ctx.currentTime;
  notes.forEach(function(freq,i){
    var osc=ctx.createOscillator();
    var gain=ctx.createGain();
    osc.type=isHeads?'sine':'triangle';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,t0+i*0.1);
    gain.gain.linearRampToValueAtTime(0.18,t0+i*0.1+0.04);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+i*0.1+0.30);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0+i*0.1); osc.stop(t0+i*0.1+0.32);
  });
}
function _playClick(){
  var ctx=_audio(); if(!ctx) return;
  var osc=ctx.createOscillator();
  var gain=ctx.createGain();
  osc.type='square'; osc.frequency.value=420;
  gain.gain.setValueAtTime(0.09,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.06);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+0.07);
}

