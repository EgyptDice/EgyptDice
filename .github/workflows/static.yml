/* ---- Real-time permission update listener ---- */
function listenForMyPermissionUpdates() {
    db.ref('admin_permission_updates/' + myGlobalShortId).on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        // Clean up the trigger
        db.ref('admin_permission_updates/' + myGlobalShortId).remove();
        // Permission was removed: close admin panel if open
        if (data.removed && !isHardcodedOwner()) {
            myAdminEntry = null;
            const adminModal = document.getElementById('adminModal');
            if (adminModal && adminModal.style.display === 'flex') {
                toggleAdminMenu(false);
                alert('Your admin permissions have been removed.');
            }
        }
        // Permissions updated: re-apply filters
        applyAdminPermissionFilters();
    });
}

