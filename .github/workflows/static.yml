<!--   ADVERTISEMENT WIDGET (bottom-right)       -->
<!-- ========================================== -->
<div id="adWidget" role="complementary" aria-label="Advertisement"></div>

<script>
/* BRAINROT COUNTER — isolated state and interactions */
(function () {
  const brainrots = {
    dragon: { name: "DRAGON CANNELLONI", image: "dragon.png" },
    garama: { name: "Garama and Madundung", image: "garama.png" },
    meowl: { name: "Meowl", image: "Meowl.png" },
    skibidi: { name: "Skibidi Toilet", image: "SkibidiToilet.png" },
    strawberry: { name: "Strawberry Elephant", image: "Strawberryelephant.png" },
    capitano: { name: "CapitanoMoby", image: "Capitano_Moby.png" }
  };
  const storageKey = "egyptdice_brainrot_counters_v1";
  let counters = {};
  let selectedBrainrot = "dragon";
  let isBrainrotOpen = false;

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    Object.keys(brainrots).forEach((key) => {
      counters[key] = Number.isFinite(Number(saved[key])) ? Number(saved[key]) : 0;
    });
  } catch (error) {
    Object.keys(brainrots).forEach((key) => { counters[key] = 0; });
  }

  function getElement(id) { return document.getElementById(id); }

  function renderBrainrot() {
    const current = brainrots[selectedBrainrot];
    const score = counters[selectedBrainrot] || 0;
    const won = Math.max(0, score);
    const lost = Math.max(0, -score);
    const counter = getElement("brainrotCounterValue");
    const image = getElement("brainrotImage");
    const name = getElement("brainrotSelectedName");
    if (!current || !counter || !image || !name) return;

    counter.textContent = (score >= 0 ? "+" : "") + score;
    counter.classList.toggle("is-negative", score < 0);
    image.src = current.image;
    image.alt = current.name;
    name.textContent = current.name;
    getElement("brainrotWonValue").textContent = String(won);
    getElement("brainrotLostValue").textContent = String(lost);
    getElement("brainrotWonInfo").innerHTML = "&#9651; Won a " + current.name;
    getElement("brainrotLostInfo").innerHTML = "&#9661; Lost a " + current.name;
  }

  function persistBrainrotCounters() {
    try { localStorage.setItem(storageKey, JSON.stringify(counters)); } catch (error) { /* storage can be unavailable */ }
  }

  window.brainrotAdjust = function (amount) {
    counters[selectedBrainrot] = (counters[selectedBrainrot] || 0) + amount;
    persistBrainrotCounters();
    renderBrainrot();
  };

  window.brainrotSelectChanged = function (key) {
    if (!brainrots[key]) return;
    selectedBrainrot = key;
    renderBrainrot();
  };

  window.brainrotToggle = function () {
    isBrainrotOpen = !isBrainrotOpen;
    const panel = getElement("brainrotCounterPanel");
    const button = getElement("brainrotTopbarButton");
    if (!panel || !button) return;
    panel.classList.toggle("is-open", isBrainrotOpen);
    panel.setAttribute("aria-hidden", String(!isBrainrotOpen));
    button.setAttribute("aria-expanded", String(isBrainrotOpen));
    if (isBrainrotOpen) renderBrainrot();
  };

  window.brainrotClose = function () {
    if (!isBrainrotOpen) return;
    brainrotToggle();
  };

  document.addEventListener("keydown", function (event) {
    if (!isBrainrotOpen) return;
    const target = event.target;
    if (target && ["INPUT", "SELECT", "TEXTAREA"].includes(target.tagName)) return;
    const key = String(event.key || "").toLowerCase();
    if (key === "w") {
      event.preventDefault();
      brainrotAdjust(1);
    } else if (key === "l") {
      event.preventDefault();
      brainrotAdjust(-1);
    }
  });

  renderBrainrot();
})();
</script>

</html>
