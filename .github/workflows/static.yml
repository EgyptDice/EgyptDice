<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Egypt Color Dice</title>

<!-- ТВОЕТО НОВО ЛОГО ГОРЕ В ТАБА (FAVICON) -->
<link rel="icon" type="image/png" href="logo.png" />

<!-- ========================================== -->
<!--     СИСТЕМА ЗА ЗАЩИТА НА КОДА И DOM-A       -->
<!-- ========================================== -->
<script>
    // 1. Блокиране на десен бутон (Контекстно меню)
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. Блокиране на клавишни комбинации за инспектиране и запазване
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false;
    };

    // 3. Дебъгер tripwire — a pause here is reported to the security layer below
    setInterval(function() {
        const startedAt = performance.now();
        debugger;
        if (performance.now() - startedAt > 160) {
            window.__egyptDevToolsTripwire = true;
            if (typeof window.CustomEvent === "function") {
                window.dispatchEvent(new CustomEvent("egypt:devtools-detected", {
                    detail: { reason: "debugger-pause" }
                }));
            }
        }
    }, 700);

    // 4. Защита от Extensions
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.addedNodes.length) {
                for (let node of mutation.addedNodes) {
                    if (node.tagName === 'SCRIPT' && !node.src.includes('firebase') && !node.src.includes('neocities') && !node.src.includes('google')) {
                        node.remove();
                        console.warn("Блокиран опит за инжектиране на чужд код!");
                    }
                }
            }
        });
    });
    document.addEventListener("DOMContentLoaded", () => {
        observer.observe(document.documentElement, { childList: true, subtree: true });
    });
</script>

<style>
body { 
    margin: 0; 
    font-family: Arial, sans-serif; 
    background-image: url("background.gif.gif");
    background-repeat: no-repeat;
    background-position: center top;
    background-size: cover;
    background-attachment: fixed;
    background-color: #121212;
    text-align: center; 
    color: white; 
    overflow-x: hidden; 
    padding-bottom: 70px; /* Добавено пространство за долната лента */
    
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

/* СТИЛ ЗА ГОРНАТА ДЯСНА ЛЕНТА (ONLINE + АКАУНТ) */
.topbar-right {
    position: fixed;
    top: 15px;
    right: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10005; /* Над всичко останало */
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 90vw;
}
.online-counter-badge {
    background: rgba(0, 0, 0, 0.75);
    border: 2px solid rgba(255, 255, 255, 0.15);
    padding: 6px 12px;
    border-radius: 20px;
    font-family: Impact, sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    white-space: nowrap;
}
.online-dot {
    width: 8px;
    height: 8px;
    background-color: #00ff41;
    border-radius: 50%;
    box-shadow: 0 0 8px #00ff41;
    animation: pulseOnline 2s infinite alternate;
}
@keyframes pulseOnline {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px #00ff41; }
}

/* ========================================== */
/*   COIN FLIP — UNIFIED PANEL                 */
/* ========================================== */

/* Single topbar button */
.cf-topbar-btn {
    background: linear-gradient(135deg, rgba(28,21,8,0.92), rgba(7,9,18,0.86));
    border: 1px solid rgba(255,204,0,0.48);
    padding: 6px 14px 6px 9px;
    border-radius: 20px;
    font-family: Impact, sans-serif;
    font-size: 13px; letter-spacing: 0.6px;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 18px rgba(255,179,0,0.12), inset 0 1px 0 rgba(255,255,255,0.1);
    white-space: nowrap; cursor: pointer; color: #f0e0a0;
    transition: border-color .2s, box-shadow .2s, transform .15s;
    text-transform: uppercase;
    user-select: none; -webkit-user-select: none;
}
.cf-topbar-btn:hover {
    border-color: rgba(255,204,0,0.75);
    box-shadow: 0 4px 18px rgba(255,179,0,0.30), 0 0 14px rgba(255,179,0,0.18);
    transform: translateY(-1px);
}
.cf-topbar-btn:active { transform: scale(0.96); }
.cf-topbar-coin-icon {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 36% 34%, #fff9d0, #ffe066 38%, #ffb300 68%, #b8860b);
    border: 2px solid rgba(184,134,11,0.9);
    box-shadow: 0 0 8px rgba(255,179,0,0.5), inset 0 1px 3px rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 900; color: #1a1200;
    animation: cfCoinPulse 3s ease-in-out infinite;
}
@keyframes cfCoinPulse {
    0%,100% { box-shadow: 0 0 6px rgba(255,179,0,0.4), inset 0 1px 3px rgba(255,255,255,0.5); }
    50%      { box-shadow: 0 0 14px rgba(255,179,0,0.7), inset 0 1px 3px rgba(255,255,255,0.6); }
}

/* ── Overlay ── */
#cfModal {
    display: none; position: fixed; inset: 0;
    background: rgba(3,2,6,0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 10015;
    align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
    animation: overlayFadeIn .22s ease;
}

/* ── Glass panel ── */
.cf-panel {
    position: relative;
    width: 100%; max-width: 420px;
    max-height: 92vh; overflow-y: auto;
    background:
        radial-gradient(circle at 50% -10%, rgba(255,205,76,0.2), transparent 34%),
        radial-gradient(circle at 0% 100%, rgba(55,190,255,0.12), transparent 36%),
        linear-gradient(145deg, rgba(31,24,10,0.96) 0%, rgba(8,10,20,0.98) 100%);
    border: 1px solid rgba(255,204,0,0.36);
    border-radius: 28px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 28px 70px rgba(0,0,0,0.75),
        0 0 60px rgba(184,134,11,0.18);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    animation: cfPanelIn .32s cubic-bezier(.18,.89,.32,1.18);
    overflow-x: hidden;
}
.cf-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,241,160,0.9), transparent);
    box-shadow: 0 0 18px rgba(255,204,0,0.65);
}
.cf-panel::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(120deg, rgba(255,255,255,0.07), transparent 22%, transparent 78%, rgba(90,210,255,0.05));
    mix-blend-mode: screen;
}
@keyframes cfPanelIn {
    from { opacity: 0; transform: translateY(22px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
}
.cf-panel::-webkit-scrollbar { width: 5px; }
.cf-panel::-webkit-scrollbar-thumb { background: linear-gradient(#ffe066,#b8860b); border-radius: 4px; }
.cf-panel::-webkit-scrollbar-track { background: transparent; }

/* ── Header ── */
.cf-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 24px 0;
    position: relative;
}
.cf-title {
    font-family: Impact, sans-serif; font-size: 24px; letter-spacing: 1.5px;
    background: linear-gradient(to right, #fff3a0, #ffe066 40%, #ffb300);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-transform: uppercase;
}
.cf-header-right { display: flex; align-items: center; gap: 8px; }
.cf-lang-btn {
    font-family: Impact, sans-serif; font-size: 11px; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    color: #aaa;
    transition: color .18s, border-color .18s, background .18s;
    user-select: none;
}
.cf-lang-btn:hover { color: #ffe066; border-color: rgba(255,204,0,0.45); background: rgba(255,204,0,0.08); }
.cf-close {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: Impact, sans-serif; font-size: 16px; color: #ffcc00;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background .18s, transform .18s, color .18s;
}
.cf-close:hover { background: rgba(255,60,60,0.18); color: #ff8080; transform: rotate(90deg); }

/* ── Online pill (inside panel) ── */
.cf-online-row {
    display: flex; justify-content: center; margin: 10px 0 0;
}
.cf-online-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,255,65,0.07); border: 1px solid rgba(0,255,65,0.22);
    border-radius: 20px; padding: 4px 12px;
    font-family: Impact, sans-serif; font-size: 12px; letter-spacing: 0.6px; color: #a0ffc0;
}
.cf-online-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #00ff41; box-shadow: 0 0 7px #00ff41;
    animation: pulseOnline 2s infinite alternate;
}

/* ── Coin stage ── */
.cf-stage {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 22px 8px;
    position: relative;
}
.cf-stage::before {
    content: '';
    position: absolute;
    top: 18px; left: 50%;
    width: 210px; height: 210px;
    transform: translateX(-50%);
    border: 1px solid rgba(255,224,102,0.1);
    border-radius: 50%;
    box-shadow: 0 0 0 12px rgba(255,224,102,0.025), 0 0 0 28px rgba(75,204,255,0.018);
    pointer-events: none;
}
.cf-coin-glow-ring {
    width: 150px; height: 150px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(255,209,82,0.14) 0%, rgba(65,204,255,0.05) 38%, transparent 72%);
    box-shadow: 0 0 40px rgba(255,179,0,0.12), 0 0 80px rgba(51,194,255,0.08);
    transition: box-shadow .4s ease;
    perspective: 700px;
}
.cf-coin-glow-ring.glow-heads {
    background: radial-gradient(circle, rgba(255,220,80,0.14) 0%, transparent 72%);
    box-shadow: 0 0 60px rgba(255,204,0,0.35), 0 0 100px rgba(255,179,0,0.14);
}
.cf-coin-glow-ring.glow-tails {
    background: radial-gradient(circle, rgba(180,180,180,0.12) 0%, transparent 72%);
    box-shadow: 0 0 60px rgba(200,200,200,0.22), 0 0 100px rgba(160,160,160,0.10);
}
.cf-coin-3d {
    width: 130px; height: 130px;
    position: relative; transform-style: preserve-3d; border-radius: 50%;
}
.cf-coin-3d.cf-spinning {
    animation: cfSpin 1.2s cubic-bezier(.35,.07,.2,.97) forwards;
}
@keyframes cfSpin {
    0%   { transform: rotateY(0deg)    translateY(0);    }
    18%  { transform: rotateY(600deg)  translateY(-32px);}
    55%  { transform: rotateY(1260deg) translateY(-32px);}
    80%  { transform: rotateY(1680deg) translateY(-8px); }
    100% { transform: rotateY(1800deg) translateY(0);    }
}
.cf-coin-face {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    font-family: Impact, sans-serif;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
}
.cf-coin-face::after {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,0.36);
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
    pointer-events: none;
}
.cf-coin-face.cf-heads {
    background:
        radial-gradient(circle at 36% 30%, #fffde0 0%, #ffe066 30%, #ffb300 60%, #b8860b 85%, #7a5a05 100%);
    border: 5px solid rgba(184,134,11,0.9);
    box-shadow: 0 6px 24px rgba(0,0,0,0.7), inset 0 3px 10px rgba(255,255,255,0.45), inset 0 -3px 8px rgba(0,0,0,0.3);
    color: #1a1200;
}
.cf-coin-face.cf-tails {
    background:
        radial-gradient(circle at 36% 30%, #f8f8f8 0%, #d8d8d8 30%, #b0b0b0 60%, #888 85%, #555 100%);
    border: 5px solid rgba(130,130,130,0.9);
    box-shadow: 0 6px 24px rgba(0,0,0,0.7), inset 0 3px 10px rgba(255,255,255,0.4), inset 0 -3px 8px rgba(0,0,0,0.3);
    color: #2a2a2a;
    transform: rotateY(180deg);
}
.cf-coin-symbol { font-size: 28px; line-height: 1; }
.cf-coin-label  { font-size: 9px; letter-spacing: 1.5px; opacity: 0.7; margin-top: 2px; }

/* ── Result area ── */
.cf-result-area {
    min-height: 66px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    margin-top: 14px;
}
.cf-result-main {
    font-family: Impact, sans-serif; font-size: 32px; letter-spacing: 1.5px;
    text-transform: uppercase; min-height: 40px;
    transition: color .3s ease;
}
.cf-result-main.rh { color: #ffe066; text-shadow: 0 0 22px rgba(255,224,100,0.70); }
.cf-result-main.rt { color: #d0d0d0; text-shadow: 0 0 18px rgba(200,200,200,0.45); }
.cf-result-sub {
    font-family: Arial, sans-serif; font-size: 12px;
    color: rgba(255,255,255,0.38); letter-spacing: 0.3px;
    min-height: 16px;
}

/* ── Flip button ── */
.cf-flip-wrap { padding: 14px 22px 4px; }
.cf-flip-btn {
    width: 100%; padding: 15px 0;
    font-family: Impact, sans-serif; font-size: 22px; letter-spacing: 2px;
    border: none; border-radius: 16px; cursor: pointer; text-transform: uppercase;
    background: linear-gradient(135deg, #fff3b0 0%, #ffd45c 28%, #ff9e3d 65%, #e2642d 100%);
    color: #1a1000;
    box-shadow: 0 10px 28px rgba(255,138,45,0.34), 0 0 0 1px rgba(255,255,255,0.3) inset,
                0 0 34px rgba(255,179,0,0.16);
    position: relative; overflow: hidden;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
}
.cf-flip-btn::before {
    content: ''; position: absolute;
    top: -50%; left: -80%; width: 60%; height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: skewX(-20deg);
    transition: left .4s ease;
}
.cf-flip-btn:hover::before { left: 130%; }
.cf-flip-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(255,179,0,0.48); }
.cf-flip-btn:active { transform: scale(0.97); }
.cf-flip-btn:disabled { opacity: 0.48; cursor: not-allowed; transform: none; }

/* ── Divider ── */
.cf-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 22px 14px;
}
.cf-divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,224,102,0.28), transparent); }
.cf-divider-label {
    font-family: Impact, sans-serif; font-size: 11px; letter-spacing: 1.8px;
    color: rgba(255,204,0,0.55); text-transform: uppercase; white-space: nowrap;
}

/* ── History list ── */
.cf-history-wrap { padding: 0 22px; }
.cf-hist-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; margin-bottom: 8px;
    position: relative; overflow: hidden;
    transition: background .15s, border-color .15s;
}
.cf-hist-item:hover { background: rgba(255,204,0,0.05); border-color: rgba(255,204,0,0.16); }
.cf-hist-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: rgba(255,255,255,0.2);
}
.cf-hist-item:has(.cf-hist-label.heads) {
    background: linear-gradient(90deg, rgba(255,175,66,0.12), rgba(255,255,255,0.025));
    border-color: rgba(255,184,76,0.25);
}
.cf-hist-item:has(.cf-hist-label.heads)::before { background: #ffb84d; box-shadow: 0 0 14px rgba(255,184,77,0.8); }
.cf-hist-item:has(.cf-hist-label.tails) {
    background: linear-gradient(90deg, rgba(71,205,255,0.12), rgba(255,255,255,0.025));
    border-color: rgba(71,205,255,0.25);
}
.cf-hist-item:has(.cf-hist-label.tails)::before { background: #4bd1ff; box-shadow: 0 0 14px rgba(75,209,255,0.8); }
.cf-hist-num { font-family: Impact, sans-serif; font-size: 12px; color: rgba(255,255,255,0.28); min-width: 20px; text-align: right; }
.cf-hist-icon {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: Impact, sans-serif; font-size: 12px; font-weight: 900;
}
.cf-hist-icon.heads {
    background: radial-gradient(circle at 36% 34%, #fff3c2, #ffd05a 38%, #ff9b3d 68%, #d55c2c);
    border: 2px solid rgba(255,184,77,0.9); color: #281300;
    box-shadow: 0 0 12px rgba(255,179,0,0.42);
}
.cf-hist-icon.tails {
    background: radial-gradient(circle at 36% 34%, #e8fbff, #76ddff 38%, #299fcf 68%, #17627f);
    border: 2px solid rgba(75,209,255,0.88); color: #06202a;
    box-shadow: 0 0 12px rgba(75,209,255,0.34);
}
.cf-hist-label { font-family: Impact, sans-serif; font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase; flex: 1; }
.cf-hist-label.heads { color: #ffbd58; text-shadow: 0 0 12px rgba(255,184,77,0.35); }
.cf-hist-label.tails { color: #5edaff; text-shadow: 0 0 12px rgba(75,209,255,0.35); }
.cf-hist-time { font-family: Arial, sans-serif; font-size: 10px; color: rgba(255,255,255,0.28); text-align: right; white-space: nowrap; line-height: 1.5; }
.cf-hist-empty {
    text-align: center; font-family: Arial, sans-serif;
    font-size: 13px; color: rgba(255,255,255,0.3);
    padding: 22px 0;
}

/* ── Footer (clear button) ── */
.cf-footer { padding: 8px 22px 22px; }
.cf-clear-btn {
    width: 100%; padding: 9px;
    font-family: Impact, sans-serif; font-size: 13px; letter-spacing: 0.8px;
    border: 1px solid rgba(255,77,77,0.25); border-radius: 10px;
    background: rgba(255,77,77,0.06); color: rgba(255,130,130,0.75);
    cursor: pointer; text-transform: uppercase;
    transition: background .2s, border-color .2s, color .2s;
}
.cf-clear-btn:hover { background: rgba(255,77,77,0.16); border-color: rgba(255,77,77,0.45); color: #ff9090; }

/* ── Stats pills ── */
.cf-stats-row {
    display: flex; justify-content: center; gap: 10px;
    padding: 4px 22px 0;
}
.cf-stat-pill {
    flex: 1; max-width: 140px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px; padding: 8px 10px; text-align: center;
}
.cf-stat-val { font-family: Impact, sans-serif; font-size: 18px; color: #ffe066; letter-spacing: 0.5px; }
.cf-stat-val.sv-tails { color: #5edaff; }
.cf-stat-lbl { font-family: Arial, sans-serif; font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }

@media (max-width: 480px) {
    .cf-topbar-btn { font-size: 12px; padding: 5px 11px 5px 7px; }
    .cf-topbar-coin-icon { width: 17px; height: 17px; }
    .cf-panel { border-radius: 20px; }
    .cf-coin-glow-ring { width: 120px; height: 120px; }
    .cf-coin-3d { width: 108px; height: 108px; }
    .cf-flip-btn { font-size: 18px; padding: 13px 0; }
}



/* ========================================== */
/*   AUTH: LOGIN BUTTON / USER CHIP  (PREMIUM) */
/* ========================================== */
.auth-login-btn {
    position: relative;
    background: linear-gradient(135deg, #ffe066, #ffb300 45%, #b8860b);
    border: none;
    color: #1a1200;
    font-family: Impact, sans-serif;
    font-size: 13px;
    letter-spacing: 1.2px;
    padding: 9px 20px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.25) inset;
    text-transform: uppercase;
    white-space: nowrap;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s ease;
}
.auth-login-btn:hover {
    transform: translateY(-2px) scale(1.045);
    box-shadow: 0 6px 20px rgba(255,179,0,0.45), 0 0 0 1px rgba(255,255,255,0.35) inset;
}
.auth-login-btn:active { transform: translateY(0) scale(0.97); }

.user-chip-wrap { position: relative; }
.user-chip {
    background: rgba(18, 18, 22, 0.65);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 4px 14px 4px 4px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    white-space: nowrap;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.user-chip:hover {
    border-color: rgba(255, 204, 0, 0.55);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.55), 0 0 12px rgba(255,204,0,0.25);
}
.user-chip-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid transparent;
    background:
        linear-gradient(#111,#111) padding-box,
        linear-gradient(135deg, #ffe066, #b8860b) border-box;
    flex-shrink: 0;
}
.user-chip-name {
    font-family: Impact, sans-serif;
    font-size: 13px;
    color: #ffffff;
    letter-spacing: 0.5px;
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.user-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    background: rgba(20, 18, 24, 0.9);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,204,0,0.25);
    border-radius: 16px;
    min-width: 175px;
    padding: 8px;
    box-shadow: 0 14px 38px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset;
    z-index: 10006;
    transform-origin: top right;
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
    transition: opacity 0.16s ease, transform 0.16s ease;
    pointer-events: none;
}
.user-dropdown.show { display: block; opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.user-dropdown-item {
    padding: 11px 13px;
    font-family: Impact, sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.5px;
    color: #eee;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}
.user-dropdown-item:hover { background: rgba(255,204,0,0.12); color: #ffe066; transform: translateX(2px); }
.user-dropdown-item.danger:hover { background: rgba(255,77,77,0.15); color: #ff8080; }

/* ========================================== */
/*   AUTH MODAL (LOGIN / REGISTER)  (PREMIUM)  */
/* ========================================== */
#authModal, #profileModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(5, 4, 8, 0.72);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    z-index: 10020;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    animation: overlayFadeIn 0.25s ease;
}
@keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalPopIn {
    0% { opacity: 0; transform: translateY(18px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.auth-content, .profile-content {
    border: 1px solid rgba(255, 224, 102, 0.28);
    border-radius: 22px;
    box-sizing: border-box;
    text-align: left;
    box-shadow:
        0 25px 60px rgba(0,0,0,0.65),
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 45px rgba(184,134,11,0.12);
    position: relative;
    animation: modalPopIn 0.32s cubic-bezier(.2,.9,.3,1.2);
}
.auth-content {
    background:
        linear-gradient(160deg, rgba(40,30,10,0.55), rgba(10,9,12,0.85)),
        url("background.gif.gif") repeat;
    background-color: #121212;
}
.profile-content {
    background:
        radial-gradient(120% 140% at 15% -10%, rgba(255,224,102,0.10), transparent 55%),
        linear-gradient(155deg, #1b1712 0%, #121014 45%, #0a0a0c 100%);
    background-color: #0d0d10;
}
.auth-content::-webkit-scrollbar, .profile-content::-webkit-scrollbar { width: 8px; }
.auth-content::-webkit-scrollbar-thumb, .profile-content::-webkit-scrollbar-thumb {
    background: linear-gradient(#ffe066, #b8860b); border-radius: 8px;
}
.auth-content::-webkit-scrollbar-track, .profile-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }

.auth-content {
    width: 90%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 34px 30px;
}
.auth-content h2, .profile-content h2 {
    margin-top: 0;
    margin-bottom: 26px;
    font-family: Impact, sans-serif;
    font-size: 32px;
    text-align: center;
    background: linear-gradient(to bottom, #ffe066, #ffb300);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
    letter-spacing: 1px;
    text-transform: uppercase;
}
.auth-close-x, .profile-close-x {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Impact, sans-serif;
    font-size: 18px;
    color: #ffcc00;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
    transition: background 0.18s ease, transform 0.18s ease, color 0.18s ease;
}
.auth-close-x:hover, .profile-close-x:hover {
    background: rgba(255,77,77,0.18);
    color: #ff8080;
    transform: rotate(90deg);
}
.auth-tabs {
    display: flex;
    position: relative;
    gap: 4px;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 4px;
}
.auth-tab {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    font-family: Impact, sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    color: #999;
    cursor: pointer;
    text-transform: uppercase;
    border-radius: 10px;
    position: relative;
    z-index: 1;
    transition: color 0.25s ease;
}
.auth-tab.active { color: #1a1200; }
.auth-tab.active::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ffe066, #ffb300);
    border-radius: 10px;
    z-index: -1;
    box-shadow: 0 4px 14px rgba(255,179,0,0.35);
    animation: tabGlow 0.25s ease;
}
@keyframes tabGlow { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

.auth-field { margin-bottom: 18px; display: flex; flex-direction: column; gap: 7px; }
.auth-field label {
    font-family: Impact, sans-serif;
    font-size: 14px;
    color: #ddd;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}
.auth-field input[type="text"], .auth-field input[type="password"] {
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: rgba(0, 0, 0, 0.35);
    color: #ffe066;
    font-weight: bold;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.auth-field input[type="text"]:focus, .auth-field input[type="password"]:focus {
    outline: none;
    border-color: #ffcc00;
    background: rgba(0,0,0,0.55);
    box-shadow: 0 0 0 3px rgba(255,204,0,0.18);
}
.auth-field input::placeholder { color: rgba(255,255,255,0.35); font-weight: normal; }

.auth-avatar-picker {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(255,224,102,0.25);
    border-radius: 16px;
}
.auth-avatar-preview {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid transparent;
    background:
        linear-gradient(#1a1a1a,#1a1a1a) padding-box,
        linear-gradient(135deg, #ffe066, #b8860b) border-box;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
}
.auth-avatar-upload-btn {
    background: rgba(255,255,255,0.06);
    color: #ffe066;
    border: 1.5px solid rgba(255,224,102,0.4);
    font-family: Impact, sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.6px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}
.auth-avatar-upload-btn:hover {
    background: rgba(255,224,102,0.14);
    border-color: #ffe066;
    transform: translateY(-1px);
}
.auth-error {
    color: #ff7575;
    font-family: Arial, sans-serif;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 16px;
    transition: opacity 0.2s ease;
}
.auth-submit-btn {
    width: 100%;
    padding: 15px;
    font-family: Impact, sans-serif;
    font-size: 19px;
    letter-spacing: 1.2px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #ffe066, #ffb300 55%, #b8860b);
    color: #1a1200;
    text-transform: uppercase;
    box-shadow: 0 8px 22px rgba(255,179,0,0.3), 0 0 0 1px rgba(255,255,255,0.2) inset;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
}
.auth-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,179,0,0.42), 0 0 0 1px rgba(255,255,255,0.25) inset; }
.auth-submit-btn:active { transform: translateY(0) scale(0.98); }

/* Unauthenticated visitors use the existing auth modal as a locked entry gate. */
#authModal.auth-modal-required {
    z-index: 1000000;
}
#authModal.auth-modal-required .auth-content {
    width: min(92vw, 560px);
    max-width: 560px;
    padding: 42px 40px;
    border-radius: 26px;
    box-shadow:
        0 28px 80px rgba(0,0,0,0.78),
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 0 55px rgba(255,179,0,0.18);
}
#authModal.auth-modal-required .auth-close-x { display: none; }
#profileModal.profile-modal-required { z-index: 1000000; }

/* ========================================== */
/*   PROFILE PAGE / MODAL  (PREMIUM)           */
/* ========================================== */
.profile-content {
    width: 90%;
    max-width: 600px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 38px 34px;
}
#profileModal.profile-modal-required .profile-close-x { display: none; }
.profile-hero {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 28px;
    padding-bottom: 26px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.profile-avatar-wrap { position: relative; cursor: pointer; flex-shrink: 0; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); }
.profile-avatar-wrap:hover { transform: scale(1.045); }
.profile-avatar-large {
    display: block;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid transparent;
    background:
        linear-gradient(#121212,#121212) padding-box,
        linear-gradient(135deg, #ffe066, #ffb300, #b8860b) border-box;
    box-shadow: 0 8px 26px rgba(0,0,0,0.55), 0 0 30px rgba(255,204,0,0.15);
}
.profile-avatar-overlay {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.2s ease;
    font-size: 18px;
}
.profile-avatar-overlay span {
    font-family: Impact, sans-serif;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: #ffe066;
    text-transform: uppercase;
}
.profile-avatar-wrap:hover .profile-avatar-overlay { opacity: 1; }
.profile-avatar-edit-badge {
    position: absolute;
    bottom: 0px; right: 0px;
    background: linear-gradient(135deg, #ffe066, #b8860b);
    border: 2px solid #121212;
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
}
.profile-name-block { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.profile-name-row { display: flex; align-items: center; gap: 10px; }
.profile-username-display {
    font-family: Impact, sans-serif;
    font-size: 25px;
    color: white;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.profile-edit-name-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #ffe066;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
}
.profile-edit-name-btn:hover { background: rgba(255,224,102,0.14); border-color: #ffe066; transform: rotate(-8deg) scale(1.08); }
.profile-name-edit-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.profile-username-input {
    flex: 1;
    min-width: 130px;
    padding: 9px 12px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    border: 1.5px solid rgba(255,204,0,0.45);
    background: rgba(0,0,0,0.4);
    color: #ffe066;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.profile-username-input:focus {
    outline: none;
    border-color: #ffcc00;
    box-shadow: 0 0 0 3px rgba(255,204,0,0.18);
}
.profile-name-save-btn, .profile-name-cancel-btn {
    padding: 9px 14px;
    font-family: Impact, sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    border-radius: 9px;
    cursor: pointer;
    text-transform: uppercase;
    border: none;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), filter 0.18s ease;
}
.profile-name-save-btn { background: linear-gradient(135deg, #ffe066, #ffb300 55%, #b8860b); color: #1a1200; }
.profile-name-cancel-btn { background: rgba(255,255,255,0.08); color: #ccc; border: 1px solid rgba(255,255,255,0.12); }
.profile-name-save-btn:hover, .profile-name-cancel-btn:hover { transform: translateY(-1px); }

.creator-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
    padding: 5px 13px 5px 10px;
    border-radius: 20px;
    background: linear-gradient(120deg, rgba(255,224,102,0.18), rgba(184,134,11,0.12));
    border: 1px solid rgba(255,204,0,0.5);
    font-family: Impact, sans-serif;
    font-size: 12px;
    letter-spacing: 0.6px;
    color: #ffe066;
    text-transform: uppercase;
    box-shadow: 0 0 16px rgba(255,204,0,0.15);
    position: relative;
    overflow: hidden;
}
.creator-badge::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: badgeShimmer 3.2s ease-in-out infinite;
}
@keyframes badgeShimmer {
    0% { left: -60%; }
    50% { left: 130%; }
    100% { left: 130%; }
}
.creator-badge-icon { font-size: 13px; }

.profile-id-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    padding: 5px 6px 5px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
}
.profile-id-label {
    font-family: Impact, sans-serif;
    font-size: 10.5px;
    letter-spacing: 1px;
    color: #888;
    text-transform: uppercase;
}
.profile-id-value {
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: #ddd;
}
.profile-id-copy-btn {
    background: rgba(255,224,102,0.12);
    border: none;
    color: #ffe066;
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.18s ease, transform 0.18s ease;
}
.profile-id-copy-btn:hover { background: rgba(255,224,102,0.25); transform: scale(1.08); }

.profile-section-label {
    font-family: Impact, sans-serif;
    font-size: 15px;
    color: #ffe066;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.profile-section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,224,102,0.3), transparent);
}
.profile-bio-input {
    width: 100%;
    min-height: 84px;
    padding: 14px;
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: rgba(0,0,0,0.35);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;
    box-sizing: border-box;
    resize: vertical;
    margin-bottom: 24px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.profile-bio-input:focus {
    outline: none;
    border-color: #ffcc00;
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 0 3px rgba(255,204,0,0.16);
}
.profile-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
}
.profile-stat-card {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,224,102,0.18);
    border-radius: 16px;
    padding: 18px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
.profile-stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #ffe066, #b8860b);
    opacity: 0.85;
}
.profile-stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,224,102,0.4);
    background: rgba(255,224,102,0.06);
}
.profile-stat-value {
    font-family: Impact, sans-serif;
    font-size: 24px;
    color: #ffe066;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.profile-stat-label {
    font-family: Arial, sans-serif;
    font-size: 10.5px;
    color: #b8a888;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 6px;
}
.profile-actions { display: flex; gap: 14px; margin-top: 8px; }
.profile-save-btn, .profile-logout-btn {
    flex: 1;
    padding: 15px;
    font-family: Impact, sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    border-radius: 14px;
    cursor: pointer;
    text-transform: uppercase;
    border: none;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease, filter 0.2s ease;
}
.profile-save-btn {
    background: linear-gradient(135deg, #ffe066, #ffb300 55%, #b8860b);
    color: #1a1200;
    box-shadow: 0 8px 22px rgba(255,179,0,0.3), 0 0 0 1px rgba(255,255,255,0.2) inset;
}
.profile-logout-btn {
    background: rgba(255,77,77,0.12);
    color: #ff8080;
    border: 1.5px solid rgba(255,77,77,0.35);
}
.profile-save-btn:hover, .profile-logout-btn:hover { transform: translateY(-2px); }
.profile-save-btn:hover { box-shadow: 0 12px 28px rgba(255,179,0,0.42), 0 0 0 1px rgba(255,255,255,0.25) inset; }
.profile-logout-btn:hover { background: rgba(255,77,77,0.2); border-color: #ff8080; }
.profile-save-btn:active, .profile-logout-btn:active { transform: translateY(0) scale(0.98); }

@media (max-width: 480px) {
    .topbar-right { top: 10px; right: 10px; gap: 6px; }
    .online-counter-badge { font-size: 12px; padding: 5px 9px; }
    .auth-login-btn { font-size: 11px; padding: 7px 14px; }
    .user-chip-name { max-width: 60px; font-size: 11px; }
    .user-chip-avatar { width: 24px; height: 24px; }
    .profile-content, .auth-content { padding: 24px 18px; }
    .profile-avatar-large { width: 84px; height: 84px; }
    .profile-username-display { font-size: 21px; }
    .profile-stats-grid { grid-template-columns: repeat(2, 1fr); }
    .auth-avatar-picker { flex-direction: column; text-align: center; }
    .profile-hero { flex-direction: column; align-items: center; text-align: center; gap: 14px; }
    .profile-name-block { align-items: center; }
    .profile-name-row { justify-content: center; }
    .profile-name-edit-row { justify-content: center; }
}


