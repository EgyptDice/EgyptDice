function saveNewAdmin() {
    const id = document.getElementById('newAdminUserId').value.trim().toUpperCase();
    const username = document.getElementById('newAdminUsername').value.trim();
    const role = document.getElementById('newAdminRole').value;

    if (!id || id.length < 4) { alert('Please enter a valid User ID (at least 4 chars)!'); return; }

    if (HARDCODED_OWNERS.includes(id)) { alert('This user is already a hardcoded Owner.'); return; }

    let permissions = {};
    if (role === 'owner') { getAllAdminPermissions().forEach(p => { permissions[p.key] = true; }); }
    else if (role === 'head_admin') { permissions = getHeadAdminPermissions(); }
    else { permissions = collectPermsFromGrid('newAdminPermsGrid'); }

    const adminUsername = (currentUser && currentUser.username) || myGlobalShortId;
    const entry = {
        role: role,
        username: username,
        permissions: permissions,
        addedBy: adminUsername,
        addedAt: firebase.database.ServerValue.TIMESTAMP
    };

    db.ref('admin_roles/' + id).set(entry).then(() => {
        logAdminAction('GRANT_ADMIN_ROLE', id, `Role: ${role}`);
        closeAddAdminModal();
        // Notify the target user in real-time via Firebase
        db.ref('admin_permission_updates/' + id).set({ updated: true, ts: firebase.database.ServerValue.TIMESTAMP });
    }).catch(() => { alert('Something went wrong while saving. Please try again.'); });
}

