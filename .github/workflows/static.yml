/* ======================================================= */
/*   EGYPT DICE INTRO — sessionStorage + full animation    */
/* ======================================================= */
(function runIntro() {

    const overlay = document.getElementById('introOverlay');

    // ── Session logic: show on new session, skip on refresh ──
    if (sessionStorage.getItem('egyptDiceIntroSeen')) {
        overlay.style.display = 'none';
        return;
    }
    sessionStorage.setItem('egyptDiceIntroSeen', '1');

    // ── Casino chime via Web Audio API ──
    function playChime() {
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            const ac = new AC();
            // Ascending casino-style: C5 E5 G5 B5 C6
            const notes = [523, 659, 784, 988, 1047];
            notes.forEach((freq, i) => {
                const t   = ac.currentTime + 0.12 + i * 0.14;
                const osc = ac.createOscillator();
                const env = ac.createGain();
                osc.connect(env); env.connect(ac.destination);
                osc.type = i < 3 ? 'triangle' : 'sine';
                osc.frequency.value = freq;
                env.gain.setValueAtTime(0, t);
                env.gain.linearRampToValueAtTime(0.28, t + 0.06);
                env.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
                osc.start(t); osc.stop(t + 0.6);
            });
            // Low shimmer pad underneath
            const pad = ac.createOscillator();
            const padEnv = ac.createGain();
            pad.connect(padEnv); padEnv.connect(ac.destination);
            pad.type = 'sine'; pad.frequency.value = 130;
            padEnv.gain.setValueAtTime(0, ac.currentTime + 0.1);
            padEnv.gain.linearRampToValueAtTime(0.08, ac.currentTime + 0.4);
            padEnv.gain.linearRampToValueAtTime(0, ac.currentTime + 2.8);
            pad.start(ac.currentTime + 0.1); pad.stop(ac.currentTime + 3);
        } catch(e) {}
    }

    // ── Gold particle system ──
    const canvas = document.getElementById('introCanvas');
    const ctx    = canvas.getContext('2d');
    let W, H, particles = [], raf;

    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const COLS = ['rgba(255,224,80,','rgba(255,185,0,','rgba(255,255,255,','rgba(255,200,50,','rgba(184,134,11,'];

    function mkParticle(born) {
        return {
            x: Math.random() * W,
            y: born ? Math.random() * H : H + 10,
            r: Math.random() * 2.4 + 0.5,
            vx:(Math.random()-0.5)*0.45,
            vy:-(Math.random()*0.7+0.25),
            alpha:0, maxA: Math.random()*0.7+0.2,
            fi: Math.random()*0.02+0.005, fo: Math.random()*0.008+0.003,
            state:'in', holdFor: Math.random()*130+70, held:0,
            color: COLS[Math.floor(Math.random()*COLS.length)],
            star: Math.random()<0.12,
        };
    }

    for (let i=0;i<100;i++) particles.push(mkParticle(true));
    let sr=0;

    function tick() {
        ctx.clearRect(0,0,W,H);
        sr++;
        if(sr%3===0 && particles.length<160) particles.push(mkParticle(false));

        particles.forEach((p,pi)=>{
            p.x+=p.vx; p.y+=p.vy;
            if(p.state==='in'){p.alpha+=p.fi; if(p.alpha>=p.maxA){p.alpha=p.maxA;p.state='hold';}}
            else if(p.state==='hold'){p.held++; if(p.held>=p.holdFor)p.state='out';}
            else{p.alpha-=p.fo; if(p.alpha<=0){particles[pi]=mkParticle(false);return;}}

            if(p.star){
                ctx.save(); ctx.globalAlpha=p.alpha;
                ctx.fillStyle=p.color+'1)'; ctx.shadowColor=p.color+'0.9)'; ctx.shadowBlur=10;
                ctx.beginPath();
                const R=p.r*2.5,r=R*0.38;
                for(let i=0;i<8;i++){const a=(i*Math.PI)/4,rad=i%2===0?R:r;
                    i===0?ctx.moveTo(p.x+rad*Math.cos(a),p.y+rad*Math.sin(a)):ctx.lineTo(p.x+rad*Math.cos(a),p.y+rad*Math.sin(a));}
                ctx.closePath(); ctx.fill(); ctx.restore();
            } else {
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle=p.color+p.alpha+')'; ctx.shadowColor=p.color+'0.6)'; ctx.shadowBlur=7; ctx.fill();
            }
        });
        raf = requestAnimationFrame(tick);
    }
    tick();

    // ── Start dice spinning (JS-driven so we can cancel anytime) ──
    const dieEls = [
        { el: document.getElementById('die1'), ax:1.8, ay:2.2, az:0.5 },
        { el: document.getElementById('die2'), ax:2.1, ay:1.4, az:0.8 },
        { el: document.getElementById('die3'), ax:1.5, ay:2.8, az:0.3 },
        { el: document.getElementById('die4'), ax:2.4, ay:1.8, az:1.0 },
    ];
    let dieRx=[20,10,35,55], dieRy=[0,30,20,10], dieRz=[0,15,5,25];
    let spinRaf;
    function spinDice(){
        dieEls.forEach((d,i)=>{
            dieRx[i]+=d.ax; dieRy[i]+=d.ay; dieRz[i]+=d.az;
            d.el.style.transform=`rotateX(${dieRx[i]}deg) rotateY(${dieRy[i]}deg) rotateZ(${dieRz[i]}deg)`;
        });
        spinRaf=requestAnimationFrame(spinDice);
    }
    spinDice();

    // ── Element refs ──
    const ring  = document.getElementById('introGlowRing');
    const egypt = document.getElementById('introEgypt');
    const divL  = document.getElementById('introDivider');
    const dtext = document.getElementById('introDiceText');
    const hiero = document.getElementById('introHiero');
    const stages= document.querySelectorAll('.intro-dice-stage');

    // ── Cinematic timeline ──
    setTimeout(playChime, 150);
    setTimeout(()=> stages.forEach(s=>s.classList.add('show')), 250);
    setTimeout(()=> ring.classList.add('show'),   350);
    setTimeout(()=> egypt.classList.add('show'),  700);
    setTimeout(()=> divL.classList.add('show'),  1050);
    setTimeout(()=> dtext.classList.add('show'), 1100);
    setTimeout(()=> hiero.classList.add('show'), 1600);
    const socialIcons = document.getElementById('introSocialIcons');
    if (socialIcons) setTimeout(()=> socialIcons.classList.add('show'), 2000);

    // ── Skip handler ──
    window.skipIntro = function() {
        overlay.classList.add('fade-out');
        setTimeout(()=>{ cancelAnimationFrame(raf); cancelAnimationFrame(spinRaf); overlay.style.display='none'; }, 900);
    };

    // ── Auto-dismiss after 4.2 s ──
    setTimeout(()=> overlay.classList.add('fade-out'), 4200);
    setTimeout(()=>{ cancelAnimationFrame(raf); cancelAnimationFrame(spinRaf); overlay.style.display='none'; }, 5200);

})();

</script>

<!-- ========================================== -->
<!--   ACCOUNT / LOGIN SYSTEM (CLIENT-SIDE)      -->
<!-- ========================================== -->
<script>
const ACCOUNTS_KEY = 'egyptdice_accounts_v1';
const SESSION_KEY = 'egyptdice_session_v1';
let currentUser = null;
let profileSetupRequired = false;
let authRequired = false;
window.__egyptAuthReady = true;
window.__egyptAuthenticated = false;

function getAccounts() {
    try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {}; } catch (e) { return {}; }
}
function saveAccounts(accounts) {
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
}

function hasExistingProfile(user) {
    if (!user) return false;
    if (user.profileCompleted === true) return true;
    if (user.profileCompleted === false) return false;

    // Legacy accounts are considered complete when they already contain
    // profile data from the existing profile system.
    return Object.prototype.hasOwnProperty.call(user, 'bio') ||
           Object.prototype.hasOwnProperty.call(user, 'avatar');
}

function enforceProfileAfterAuth() {
    if (!currentUser || hasExistingProfile(currentUser)) {
        profileSetupRequired = false;
        if (currentUser && typeof rollDice === 'function') rollDice(true);
        return;
    }

    profileSetupRequired = true;
    openProfileModal();
}

function enforceAuthOnEntry() {
    if (currentUser) {
        authRequired = false;
        return;
    }
    authRequired = true;
    openAuthModal('register');
}

async function hashPassword(pass) {
    const enc = new TextEncoder().encode(pass);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function defaultAvatar() {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><circle cx="50" cy="38" r="18" fill="#888"/><ellipse cx="50" cy="94" rx="32" ry="26" fill="#888"/></svg>';
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function makeAccountId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let text = '';
    for (let i = 0; i < 10; i++) text += chars.charAt(Math.floor(Math.random() * chars.length));
    return 'ED-' + text;
}

/* ---------- MODAL CONTROLS ---------- */
function openAuthModal(mode) {
    const authModal = document.getElementById('authModal');
    authModal.classList.toggle('auth-modal-required', authRequired && !currentUser);
    authModal.style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('registerUsername').value = '';
    document.getElementById('registerPassword').value = '';
    document.getElementById('registerPasswordConfirm').value = '';
    const regPreview = document.getElementById('registerAvatarPreview');
    regPreview.src = defaultAvatar();
    delete regPreview.dataset.value;
    switchAuthTab(mode || 'login');
}
function closeAuthModal() {
    if (authRequired && !currentUser) return;
    const authModal = document.getElementById('authModal');
    authModal.style.display = 'none';
    authModal.classList.remove('auth-modal-required');
}
function switchAuthTab(mode) {
    const isLogin = mode === 'login';
    document.getElementById('authTabLogin').classList.toggle('active', isLogin);
    document.getElementById('authTabRegister').classList.toggle('active', !isLogin);
    document.getElementById('authFormLogin').style.display = isLogin ? 'block' : 'none';
    document.getElementById('authFormRegister').style.display = isLogin ? 'none' : 'block';
    document.getElementById('authModalTitle').innerText = isLogin ? 'Login' : 'Create Account';
    document.getElementById('authError').innerText = '';
}
document.getElementById('authModal').addEventListener('click', function (e) {
    if (e.target === this) closeAuthModal();
});
document.getElementById('profileModal').addEventListener('click', function (e) {
    if (e.target === this) closeProfileModal();
});

/* ---------- AVATAR UPLOAD (resize to square, compressed) ---------- */
function handleAvatarFileSelect(event, previewId) {
    const file = event.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { alert('Please select an image file.'); return; }
    const reader = new FileReader();
    reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
            const size = 160;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            const previewEl = document.getElementById(previewId);
            previewEl.src = dataUrl;
            previewEl.dataset.value = dataUrl;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

/* ---------- REGISTER / LOGIN / LOGOUT ---------- */
async function registerAccount() {
    const errorEl = document.getElementById('authError');
    errorEl.innerText = '';
    const username = document.getElementById('registerUsername').value.trim();
    const password = document.getElementById('registerPassword').value;
    const confirmPass = document.getElementById('registerPasswordConfirm').value;
    const avatarImg = document.getElementById('registerAvatarPreview');
    const avatar = avatarImg.dataset.value || defaultAvatar();

    if (!/^[A-Za-z0-9_]{3,16}$/.test(username)) {
        errorEl.innerText = 'Username must be 3-16 characters (letters, numbers, _).';
        return;
    }
    if (password.length < 4) {
        errorEl.innerText = 'Password must be at least 4 characters.';
        return;
    }
    if (password !== confirmPass) {
        errorEl.innerText = 'Passwords do not match.';
        return;
    }

    const accounts = getAccounts();
    const key = username.toLowerCase();
    if (accounts[key]) {
        errorEl.innerText = 'That username is already taken.';
        return;
    }

    const passHash = await hashPassword(password);
    accounts[key] = {
        username: username,
        passHash: passHash,
        avatar: avatar,
        bio: '',
        accountId: makeAccountId(),
        joined: new Date().toISOString().slice(0, 10),
        stats: { totalRolls: 0, bestStreak: 0, gamesPlayed: 0 },
        profileCompleted: false
    };
    saveAccounts(accounts);
    localStorage.setItem(SESSION_KEY, key);
    currentUser = accounts[key];
    setOnlinePresence();
    closeAuthModal();
    renderAuthUI();
    enforceProfileAfterAuth();
}

async function loginAccount() {
    const errorEl = document.getElementById('authError');
    errorEl.innerText = '';
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const accounts = getAccounts();
    const key = username.toLowerCase();
    const account = accounts[key];
    if (!account) { errorEl.innerText = 'No account found with that username.'; return; }
    const passHash = await hashPassword(password);
    if (passHash !== account.passHash) { errorEl.innerText = 'Incorrect password.'; return; }
    localStorage.setItem(SESSION_KEY, key);
    currentUser = account;
    setOnlinePresence();
    closeAuthModal();
    renderAuthUI();
    enforceProfileAfterAuth();
}

function logoutAccount() {
    if (myPresenceRef) myPresenceRef.remove();
    localStorage.removeItem(SESSION_KEY);
    currentUser = null;
    document.getElementById('userDropdown').classList.remove('show');
    closeProfileModal();
    renderAuthUI();
    openAuthModal('register');
}

/* ---------- TOP BAR RENDERING ---------- */
function toggleUserDropdown() {
    document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', function (e) {
    const wrap = document.getElementById('userChipWrap');
    if (wrap && !wrap.contains(e.target)) {
        document.getElementById('userDropdown').classList.remove('show');
    }
});

function renderAuthUI() {
    const loginBtn = document.getElementById('loginBtn');
    const chipWrap = document.getElementById('userChipWrap');
    window.__egyptAuthenticated = !!currentUser;
    authRequired = !currentUser;
    if (currentUser) {
        loginBtn.style.display = 'none';
        chipWrap.style.display = 'block';
        document.getElementById('userChipAvatar').src = currentUser.avatar || defaultAvatar();
        document.getElementById('userChipName').innerText = currentUser.username;
    } else {
        loginBtn.style.display = 'inline-block';
        chipWrap.style.display = 'none';
    }
}

/* ---------- PROFILE PAGE ---------- */
function ensureAccountId(user) {
    if (!user.accountId) {
        user.accountId = makeAccountId();
        const accounts = getAccounts();
        accounts[user.username.toLowerCase()] = user;
        saveAccounts(accounts);
    }
    return user.accountId;
}

function isContentCreator() {
    try {
        if (typeof vipPlayers === 'undefined' || typeof getVipStatus !== 'function' || !myGlobalShortId) return false;
        const status = getVipStatus(vipPlayers[myGlobalShortId]);
        return status === 'active' || status === 'permanent';
    } catch (e) { return false; }
}

function openProfileModal() {
    if (!currentUser) return;
    document.getElementById('userDropdown').classList.remove('show');
    document.getElementById('profileAvatarPreview').src = currentUser.avatar || defaultAvatar();
    document.getElementById('profileUsernameDisplay').innerText = currentUser.username;
    document.getElementById('profileBioInput').value = currentUser.bio || '';
    document.getElementById('profileIdValue').innerText = ensureAccountId(currentUser);
    document.getElementById('usernameEditError').innerText = '';
    cancelEditUsername();
    document.getElementById('creatorBadge').style.display = isContentCreator() ? 'inline-flex' : 'none';
    renderProfileStats();
    const profileModal = document.getElementById('profileModal');
    profileModal.classList.toggle('profile-modal-required', profileSetupRequired);
    profileModal.style.display = 'flex';
}
function closeProfileModal() {
    if (profileSetupRequired && currentUser) return;
    const profileModal = document.getElementById('profileModal');
    profileModal.style.display = 'none';
    profileModal.classList.remove('profile-modal-required');
}

/* ---------- USERNAME EDITING ---------- */
function startEditUsername() {
    document.getElementById('profileNameRow').style.display = 'none';
    document.getElementById('profileNameEditRow').style.display = 'flex';
    const input = document.getElementById('profileUsernameInput');
    input.value = currentUser.username;
    input.focus();
    input.select();
}
function cancelEditUsername() {
    document.getElementById('profileNameRow').style.display = 'flex';
    document.getElementById('profileNameEditRow').style.display = 'none';
    document.getElementById('usernameEditError').innerText = '';
}
function saveUsername() {
    const errorEl = document.getElementById('usernameEditError');
    errorEl.innerText = '';
    const newUsername = document.getElementById('profileUsernameInput').value.trim();

    if (!/^[A-Za-z0-9_]{3,16}$/.test(newUsername)) {
        errorEl.innerText = 'Username must be 3-16 characters (letters, numbers, _).';
        return;
    }

    const oldKey = currentUser.username.toLowerCase();
    const newKey = newUsername.toLowerCase();
    const accounts = getAccounts();

    if (newKey !== oldKey && accounts[newKey]) {
        errorEl.innerText = 'That username is already taken.';
        return;
    }

    currentUser.username = newUsername;
    if (newKey !== oldKey) {
        delete accounts[oldKey];
        accounts[newKey] = currentUser;
        localStorage.setItem(SESSION_KEY, newKey);
    } else {
        accounts[oldKey] = currentUser;
    }
    saveAccounts(accounts);
    setOnlinePresence();

    document.getElementById('profileUsernameDisplay').innerText = currentUser.username;
    cancelEditUsername();
    renderAuthUI();
}

/* ---------- COPY ACCOUNT ID ---------- */
function copyProfileId() {
    const id = document.getElementById('profileIdValue').innerText;
    const btn = document.querySelector('.profile-id-copy-btn');
    const done = () => {
        if (!btn) return;
        const original = btn.innerText;
        btn.innerText = '✓';
        setTimeout(() => { btn.innerText = original; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(id).then(done).catch(done);
    } else {
        const temp = document.createElement('textarea');
        temp.value = id;
        document.body.appendChild(temp);
        temp.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(temp);
        done();
    }
}

function renderProfileStats() {
    const grid = document.getElementById('profileStatsGrid');
    grid.innerHTML = '';
    const stats = (currentUser && currentUser.stats) || {};

    const items = [
        { label: 'Total Rolls', value: stats.totalRolls || 0 },
        { label: 'Games Played', value: stats.gamesPlayed || 0 },
        { label: 'Best Streak', value: stats.bestStreak || 0 },
        { label: 'Member Since', value: currentUser.joined || '-' }
    ];
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'profile-stat-card';
        card.innerHTML = `<div class="profile-stat-value">${item.value}</div><div class="profile-stat-label">${item.label}</div>`;
        grid.appendChild(card);
    });
}

function saveProfile() {
    if (!currentUser) return;
    const bio = document.getElementById('profileBioInput').value.trim().slice(0, 200);
    const avatarSrc = document.getElementById('profileAvatarPreview').src;
    currentUser.bio = bio;
    currentUser.avatar = avatarSrc;
    currentUser.profileCompleted = true;
    const accounts = getAccounts();
    const key = currentUser.username.toLowerCase();
    accounts[key] = currentUser;
    saveAccounts(accounts);
    renderAuthUI();
    profileSetupRequired = false;
    closeProfileModal();
    if (typeof rollDice === 'function') rollDice(true);
}

/* ---------- STATS TRACKING HOOK (called from rollDice) ---------- */
function recordAccountRoll(rollColors) {
    if (!currentUser) return;
    if (!currentUser.stats) currentUser.stats = { totalRolls: 0, bestStreak: 0, gamesPlayed: 0 };
    const stats = currentUser.stats;
    stats.totalRolls = (stats.totalRolls || 0) + rollColors.length;
    stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
    const streaks = {};
    rollColors.forEach(c => { streaks[c] = (streaks[c] || 0) + 1; });
    Object.keys(streaks).forEach(c => { if (streaks[c] > stats.bestStreak) stats.bestStreak = streaks[c]; });
    delete stats.colorCounts;
    const accounts = getAccounts();
    accounts[currentUser.username.toLowerCase()] = currentUser;
    saveAccounts(accounts);
}

/* ---------- BLUR DICE TOGGLE ---------- */
const BLUR_DICE_KEY = 'blurDicePref';

function applyDiceBlur(enabled) {
    const diceBox = document.getElementById('diceBox');
    if (diceBox) diceBox.classList.toggle('blur-active', enabled);
    const stateEl = document.getElementById('blurDiceState');
    if (stateEl) stateEl.innerText = enabled ? 'ON' : 'OFF';
}

function toggleDiceBlur() {
    const checkbox = document.getElementById('blurDiceToggle');
    const enabled = checkbox.checked;
    localStorage.setItem(BLUR_DICE_KEY, enabled ? '1' : '0');
    applyDiceBlur(enabled);
}

function initDiceBlurPref() {
    const saved = localStorage.getItem(BLUR_DICE_KEY) === '1';
    const checkbox = document.getElementById('blurDiceToggle');
    if (checkbox) checkbox.checked = saved;
    applyDiceBlur(saved);
}
initDiceBlurPref();

/* ---------- SESSION RESTORE ON LOAD ---------- */
function initAccountSession() {
    const sessionKey = localStorage.getItem(SESSION_KEY);
    if (sessionKey) {
        const accounts = getAccounts();
        if (accounts[sessionKey]) currentUser = accounts[sessionKey];
        else localStorage.removeItem(SESSION_KEY);
    }
    renderAuthUI();
    if (currentUser) enforceProfileAfterAuth();
    else enforceAuthOnEntry();
}
initAccountSession();
setOnlinePresence();


