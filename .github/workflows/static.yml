/* ============================================================
   ADMIN ROLE MANAGEMENT SYSTEM
   Firebase path: admin_roles/{userId}
   Structure: { role, username, permissions:{...}, addedBy, addedAt }
   Hardcoded owner IDs always have full access regardless of DB.
   ============================================================ */

const HARDCODED_OWNERS = ['PHQA4L7Q',];

/*
 * The Admin Menu is the source of truth for permissions.
 * Any future section with data-admin-permission automatically appears in
 * the Admin Manager and is included in owner/head-admin access.
 */
const ADMIN_SYSTEM_PERMISSIONS = [
    { key: 'allIDo', label: '🌟 All I Do' }
];

function getAllAdminPermissions() {
    const permissions = [];
    const seen = new Set();

    document.querySelectorAll('#adminModal [data-admin-permission]').forEach(section => {
        const key = section.dataset.adminPermission;
        if (!key || seen.has(key)) return;
        const title = section.querySelector('.admin-manage-title');
        const label = (title ? title.textContent : key).replace(/\s+/g, ' ').trim();
        permissions.push({ key, label });
        seen.add(key);
    });

    ADMIN_SYSTEM_PERMISSIONS.forEach(permission => {
        if (!seen.has(permission.key)) permissions.push(permission);
    });
    return permissions;
}

function getHeadAdminPermissions() {
    return getAllAdminPermissions().reduce((permissions, permission) => {
        permissions[permission.key] = true;
        return permissions;
    }, {});
}

let adminRoles = {};  // {userId: {role, username, permissions, addedBy, addedAt}}
let myAdminEntry = null;  // My own admin entry

/* ---- Init: called from initUserSession ---- */
function initAdminSystem() {
    db.ref('admin_roles').on('value', (snap) => {
        adminRoles = snap.val() || {};
        // Get my own entry
        myAdminEntry = adminRoles[myGlobalShortId] || null;
        // Push admins data to all open admin UIs
        renderAdminRolesList();
        applyAdminPermissionFilters();
    });
    // Real-time listener for advertisements
    db.ref('advertisements').on('value', (snap) => {
        adsData = snap.val() || {};
        renderAdManagerList();
        startAdRotation();
    });
}

/* ---- Permission helpers ---- */
function isHardcodedOwner(id) {
    return HARDCODED_OWNERS.includes(id || myGlobalShortId);
}

function getMyRole() {
    if (isHardcodedOwner()) return 'owner';
    if (!myAdminEntry) return null;
    return myAdminEntry.role || null;
}

function hasPermission(permKey) {
    const role = getMyRole();
    if (!role) return false;
    if (role === 'owner') return true;
    if (role === 'head_admin') {
        // manageAdmins is owner-only
        if (permKey === 'manageAdmins') return false;
        return true;
    }
    // admin role — allIDo grants access to all section permissions
    if (myAdminEntry && myAdminEntry.permissions) {
        if (myAdminEntry.permissions['allIDo'] && permKey !== 'manageAdmins') return true;
        return !!myAdminEntry.permissions[permKey];
    }
    return false;
}

function canOpenAdminPanel() {
    return isHardcodedOwner() || (myAdminEntry && myAdminEntry.role);
}

/* ---- Apply permission filters to admin panel sections ---- */
function applyAdminPermissionFilters() {
    const modal = document.getElementById('adminModal');
    if (!modal) return;
    const role = getMyRole();
    if (!role) return;

    modal.querySelectorAll('[data-admin-permission]').forEach(el => {
        const perm = el.dataset.adminPermission;
        if (perm === 'manageAdmins') {
            // manageAdmins is role-based: owner only
            el.style.display = (role === 'owner') ? '' : 'none';
        } else {
            el.style.display = hasPermission(perm) ? '' : 'none';
        }
    });
}

/* ---- Logging ---- */
function logAdminAction(action, targetId, details) {
    const adminUsername = (myAdminEntry && myAdminEntry.username) || (currentUser && currentUser.username) || myGlobalShortId;
    const entry = {
        action: action,
        adminId: myGlobalShortId,
        adminUsername: adminUsername,
        targetId: targetId || '',
        details: details || '',
        ts: firebase.database.ServerValue.TIMESTAMP
    };
    db.ref('admin_logs').push(entry);
}

/* ---- Admin Roles Manager Modal ---- */
function openAdminRolesManager() {
    document.getElementById('adminRolesManagerModal').style.display = 'flex';
    renderAdminRolesList();
}
function closeAdminRolesManager() { document.getElementById('adminRolesManagerModal').style.display = 'none'; }

function renderAdminRolesList() {
    const container = document.getElementById('adminRolesContainer');
    if (!container) return;

    const searchTerm = (document.getElementById('adminRolesSearch') ? document.getElementById('adminRolesSearch').value.trim().toUpperCase() : '');
    let entries = Object.entries(adminRoles).map(([id, data]) => ({ id, ...data }));

    // Also include hardcoded owners as virtual entries if not already in DB
    HARDCODED_OWNERS.forEach(ownerId => {
        if (!adminRoles[ownerId]) {
            entries.unshift({ id: ownerId, role: 'owner', username: 'OWNER', isHardcoded: true });
        }
    });

    if (searchTerm) {
        entries = entries.filter(e =>
            e.id.toUpperCase().includes(searchTerm) ||
            (e.username || '').toUpperCase().includes(searchTerm)
        );
    }

    const countPill = document.getElementById('adminCountPill');
    if (countPill) {
        const total = Object.keys(adminRoles).length + HARDCODED_OWNERS.filter(id => !adminRoles[id]).length;
        countPill.innerText = `${total} admin${total !== 1 ? 's' : ''}`;
    }

    container.innerHTML = '';
    if (entries.length === 0) {
        container.innerHTML = "<div class='admin-roles-empty'>👑 No admins found.</div>";
        return;
    }

    const roleLabelMap = { owner: '👑 OWNER', head_admin: '⭐ HEAD ADMIN', admin: '🔧 ADMIN' };
    const roleClassMap = { owner: 'owner', head_admin: 'head_admin', admin: 'admin' };

    entries.forEach(e => {
        const card = document.createElement('div');
        const cardClass = e.role === 'owner' ? 'owner-card' : (e.role === 'head_admin' ? 'head-card' : '');
        card.className = `admin-role-card ${cardClass}`;

        const displayName = e.username && e.username.trim() ? e.username : e.id;
        const roleLabel = roleLabelMap[e.role] || e.role || 'ADMIN';
        const roleBadgeClass = roleClassMap[e.role] || 'admin';
        const addedDate = e.addedAt ? new Date(e.addedAt).toLocaleDateString('en-GB') : '-';

        const isSelf = e.id === myGlobalShortId;
        const canEdit = hasPermission('manageAdmins') && !e.isHardcoded;
        const editBtn = canEdit ? `<button class="admin-btn-edit-role" onclick="openEditAdminModal('${e.id}')">✏️ EDIT</button>` : '';
        const removeBtn = canEdit && !isSelf ? `<button class="admin-btn-remove-role" onclick="removeAdminById('${e.id}')">🗑️ REMOVE</button>` : '';

        const hardcodedNote = e.isHardcoded ? '<div style="font-family:Arial;font-size:10px;color:#cc7744;margin-top:4px;">⚙️ Hardcoded owner</div>' : '';

        card.innerHTML = `
            <div class="admin-card-top">
                <span class="admin-card-username">${displayName}</span>
                <span class="admin-role-badge ${roleBadgeClass}">${roleLabel}</span>
            </div>
            <div class="admin-card-id">🆔 ${e.id}${isSelf ? ' (you)' : ''}</div>
            <div class="admin-card-row"><span>Added</span><b>${addedDate}</b></div>
            <div class="admin-card-row"><span>Added by</span><b>${e.addedBy || '-'}</b></div>
            ${hardcodedNote}
            ${(editBtn || removeBtn) ? `<div class="admin-card-actions">${editBtn}${removeBtn}</div>` : ''}
        `;
        container.appendChild(card);
    });
}

/* ---- Permission checkboxes builder ---- */
function buildPermsGrid(containerId, currentPerms, role, readonlyAll) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    getAllAdminPermissions().forEach(p => {
        // For owner/head_admin all perms are forced on and shown read-only
        // Admin Manager remains owner-only, matching the existing access rule.
        const isDisabled = readonlyAll || role === 'owner' || role === 'head_admin' || p.key === 'manageAdmins';
        let isChecked;
        if (role === 'owner') isChecked = true;
        else if (role === 'head_admin') isChecked = true;
        else isChecked = !!(currentPerms && currentPerms[p.key]);

        const div = document.createElement('label');
        div.className = 'admin-perm-check' + (isDisabled ? ' disabled-perm' : '');
        div.innerHTML = `
            <input type="checkbox" name="perm_${p.key}" value="${p.key}"
                ${isChecked ? 'checked' : ''}
                ${isDisabled ? 'disabled' : ''}>
            ${p.label}
        `;
        container.appendChild(div);
    });
}

function collectPermsFromGrid(containerId) {
    const perms = {};
    getAllAdminPermissions().forEach(p => {
        const el = document.querySelector(`#${containerId} input[name="perm_${p.key}"]`);
        if (el) perms[p.key] = el.checked;
    });
    return perms;
}

