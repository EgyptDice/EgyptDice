/* ── Ad popup panel — anchored above the Paid Ads button ── */
#adWidget {
    position: fixed;
    bottom: 120px;          /* clears the ~104px footer + gap               */
    left: 12px;
    width: 252px;
    z-index: 10004;         /* above footer (9998) but below modals (10010) */
