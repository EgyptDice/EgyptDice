</div>

<!-- JUMP SCARE FULLSCREEN OVERLAY -->
<div id="jumpScareOverlay">
    <img id="jumpScareImg" src="" alt="">
</div>

<!-- ЛИЧНО ИЗВЕСТИЕ ЗА ИГРАЧА -->
<div id="playerAnnounceModal">
    <div class="player-announce-content">
        <div class="player-announce-title">📩 SYSTEM NOTICE</div>
        <div class="player-announce-msg" id="playerAnnounceText">You have a new message from the admin!</div>
        <button class="admin-btn btn-save" style="width: 100%;" onclick="closePlayerAnnounce()">OK</button>
    </div>
</div>

<!-- ========================================== -->
<!--   COIN FLIP — UNIFIED PANEL                 -->
<!-- ========================================== -->
<div id="cfModal">
  <div class="cf-panel">

    <!-- Header -->
    <div class="cf-header">
      <div class="cf-title" id="cfTitle">COIN FLIP</div>
      <div class="cf-header-right">
        <div class="cf-lang-btn" id="cfLangBtn" onclick="cfToggleLang()">BG</div>
        <div class="cf-close" onclick="cfClose()">&#x2715;</div>
      </div>
    </div>

    <!-- Online pill -->
    <div class="cf-online-row">
      <div class="cf-online-pill">
        <div class="cf-online-dot"></div>
        <span id="cfOnlineTxt">ONLINE:</span>&nbsp;<span id="cfOnlineVal" style="color:#00ff41;font-weight:900;">1</span>
      </div>
    </div>

    <!-- Coin stage -->
    <div class="cf-stage">
      <div class="cf-coin-glow-ring" id="cfGlowRing">
        <div class="cf-coin-3d" id="cfCoin">
          <div class="cf-coin-face cf-heads" id="cfFaceH">
            <div class="cf-coin-symbol">&#9651;</div>
            <div class="cf-coin-label" id="cfLabelH">H</div>
          </div>
          <div class="cf-coin-face cf-tails" id="cfFaceT">
            <div class="cf-coin-symbol">&#9661;</div>
            <div class="cf-coin-label" id="cfLabelT">T</div>
          </div>
        </div>
      </div>

      <div class="cf-result-area">
        <div class="cf-result-main" id="cfResultMain"></div>
        <div class="cf-result-sub"  id="cfResultSub"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="cf-stats-row">
      <div class="cf-stat-pill">
        <div class="cf-stat-val" id="cfStatH">0</div>
        <div class="cf-stat-lbl" id="cfStatHLbl">HEADS</div>
      </div>
      <div class="cf-stat-pill">
        <div class="cf-stat-val sv-tails" id="cfStatT">0</div>
        <div class="cf-stat-lbl" id="cfStatTLbl">TAILS</div>
      </div>
    </div>

    <!-- Flip button -->
    <div class="cf-flip-wrap">
      <button class="cf-flip-btn" id="cfFlipBtn" onclick="cfDoFlip()">FLIP!</button>
    </div>

    <!-- History divider -->
    <div class="cf-divider">
      <div class="cf-divider-line"></div>
      <div class="cf-divider-label" id="cfHistTitle">RECENT FLIPS</div>
      <div class="cf-divider-line"></div>
    </div>

    <!-- History list -->
    <div class="cf-history-wrap" id="cfHistList"></div>

    <!-- Footer -->
    <div class="cf-footer">
      <button class="cf-clear-btn" id="cfClearBtn" onclick="cfClearHistory()">&#128465; CLEAR HISTORY</button>
    </div>

  </div>
</div>

<!-- ГОРНА ДЯСНА ЛЕНТА: БРОЯЧ ОНЛАЙН + АКАУНТ -->
<div class="topbar-right">

    <!-- BRAINROT COUNTER BUTTON -->
    <button type="button" class="brainrot-topbar-btn" id="brainrotTopbarButton" aria-expanded="false" aria-controls="brainrotCounterPanel" onclick="brainrotToggle()">
        <span class="brainrot-glyph" aria-hidden="true">BR</span>
        <span>BRAINROT COUNTER</span>
    </button>

    <!-- COIN FLIP BUTTON -->
    <div class="cf-topbar-btn" onclick="cfOpen()">
      <div class="cf-topbar-coin-icon">&#x24BE;</div>
      <span id="cfTopLabel">COIN FLIP</span>
    </div>

    <!-- БРОЯЧ НА ХОРАТА ОНЛАЙН В МОМЕНТА (РЕАЛЕН БРОЙ) -->
    <div class="online-counter-badge">
        <div class="online-dot"></div>
        <span>ONLINE: <span id="onlineCountDisplay" style="color: #00ff41;">1</span></span>
    </div>

    <!-- LOGIN БУТОН (показва се, когато няма влязъл потребител) -->
    <button class="auth-login-btn" id="loginBtn" onclick="openAuthModal('login')">Login</button>

    <!-- ПОТРЕБИТЕЛСКИ ЧИП (показва се, когато има влязъл потребител) -->
    <div class="user-chip-wrap" id="userChipWrap" style="display:none;">
        <div class="user-chip" id="userChip" onclick="toggleUserDropdown()">
            <img class="user-chip-avatar" id="userChipAvatar" src="" alt="">
            <span class="user-chip-name" id="userChipName"></span>
        </div>
        <div class="user-dropdown" id="userDropdown">
            <div class="user-dropdown-item" onclick="openProfileModal()">👤 My Profile</div>
            <div class="user-dropdown-item danger" onclick="logoutAccount()">🚪 Log Out</div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!--   AUTH MODAL: LOGIN / REGISTER              -->
<!-- ========================================== -->
<div id="authModal">
    <div class="auth-content">
        <span class="auth-close-x" onclick="closeAuthModal()">✕</span>
        <h2 id="authModalTitle">Login</h2>

        <div class="auth-tabs">
            <div class="auth-tab active" id="authTabLogin" onclick="switchAuthTab('login')">Login</div>
            <div class="auth-tab" id="authTabRegister" onclick="switchAuthTab('register')">Register</div>
        </div>

        <div class="auth-error" id="authError"></div>

        <!-- LOGIN FORM -->
        <div id="authFormLogin">
            <div class="auth-field">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username">
            </div>
            <div class="auth-field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button class="auth-submit-btn" onclick="loginAccount()">Login</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="authFormRegister" style="display:none;">
            <div class="auth-avatar-picker">
                <img class="auth-avatar-preview" id="registerAvatarPreview" src="" alt="">
                <label class="auth-avatar-upload-btn">
                    Upload Photo
                    <input type="file" accept="image/*" id="registerAvatarInput" style="display:none;" onchange="handleAvatarFileSelect(event, 'registerAvatarPreview')">
                </label>
            </div>
            <div class="auth-field">
                <label>Username</label>
                <input type="text" id="registerUsername" placeholder="Choose a username" autocomplete="username">
            </div>
            <div class="auth-field">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Choose a password" autocomplete="new-password">
            </div>
            <div class="auth-field">
                <label>Confirm Password</label>
                <input type="password" id="registerPasswordConfirm" placeholder="Confirm your password" autocomplete="new-password">
            </div>
            <button class="auth-submit-btn" onclick="registerAccount()">Create Account</button>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!--   PROFILE MODAL / PAGE                      -->
<!-- ========================================== -->
<div id="profileModal">
    <div class="profile-content">
        <span class="profile-close-x" onclick="closeProfileModal()">✕</span>

        <div class="profile-hero">
            <div class="profile-avatar-wrap" onclick="document.getElementById('profileAvatarInput').click()">
                <img class="profile-avatar-large" id="profileAvatarPreview" src="" alt="">
