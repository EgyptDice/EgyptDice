/* ========================================== */
/*   BLUR DICE TOGGLE                          */
/* ========================================== */
.dice-container { transition: filter 0.45s ease; }
.dice-container.blur-active { filter: blur(5px); }

.blur-toggle-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 204, 0, 0.35);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03) inset;
}
.blur-toggle-label {
    font-family: Impact, sans-serif;
    font-size: 15px;
    letter-spacing: 0.8px;
    color: #ffe066;
    text-transform: uppercase;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
}
.blur-toggle-switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
    flex-shrink: 0;
    cursor: pointer;
}
.blur-toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.blur-toggle-slider {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 30px;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.blur-toggle-slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    top: 3px;
    background: linear-gradient(145deg, #f5f0e0, #d4c89a);
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease;
}
.blur-toggle-switch input:checked + .blur-toggle-slider {
    background: linear-gradient(135deg, #ffe066, #ffb300 45%, #b8860b);
    border-color: rgba(255,255,255,0.35);
    box-shadow: 0 0 12px rgba(255,179,0,0.5);
}
.blur-toggle-switch input:checked + .blur-toggle-slider::before {
    transform: translateX(24px);
    background: linear-gradient(145deg,#2a1f0a,#1a1205);
}
.blur-toggle-state {
    font-family: Impact, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #cccccc;
    min-width: 32px;
    text-align: left;
}

.stats-panel { background: rgba(0, 0, 0, 0.4); border-radius: 15px; padding: 20px; margin-top: 25px; text-align: left; font-family: Impact, sans-serif; }
.stats-section-title { font-size: 24px; color: white; margin-bottom: 12px; }
