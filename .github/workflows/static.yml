// Returns 'permanent' | 'active' | 'expired' for a given vip entry
function getVipStatus(entry) {
    if (!entry) return 'expired';
    if (entry.permanent) return 'permanent';
    if (typeof entry.expiresAt === 'number' && entry.expiresAt > Date.now()) return 'active';
    return 'expired';
}

function formatVipDate(ts) {
    if (!ts) return '-';
    const d = new Date(ts);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

// --- Player-facing banner: shows only to a player who currently has active/permanent VIP ---
function renderVipBanner() {
    const banner = document.getElementById("vipRoomBanner");
    const nameEl = document.getElementById("vipBannerName");
    const picEl = document.getElementById("vipBannerPic");
    const mainSiteBanner = document.getElementById("mainSiteBanner");
    const myEntry = vipPlayers[myGlobalShortId];
    const status = getVipStatus(myEntry);
    if (myEntry && (status === 'active' || status === 'permanent')) {
        const displayName = (myEntry.username && myEntry.username.trim()) ? myEntry.username.toUpperCase() : "VIP";
        const displayPic = (myEntry.profilePic && myEntry.profilePic.trim()) ? myEntry.profilePic : "https://i.pravatar.cc/100?img=11";
        nameEl.innerText = displayName;
        picEl.src = displayPic;
        if (mainSiteBanner) mainSiteBanner.src = "vip.gif.gif";
        banner.style.display = "flex";
    } else {
        if (mainSiteBanner) mainSiteBanner.src = "baner.gif.gif";
        banner.style.display = "none";
    }
}

