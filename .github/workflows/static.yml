};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myGlobalShortId = "";
let myPresenceRef = null;
let onlinePlayers = {};
let sessionStartedAt = Date.now();
let isRolling = false;
let history = [];
const rollSound = new Audio("https://raw.githubusercontent.com/4ybanMNLA/gperya-sounds/main/roll-sound.mp3");

let colorCounts = { red: 0, orange: 0, yellow: 0, green: 0, blue: 0, purple: 0 };
let longestStreak = { color: '', count: 0 };
let activeColors = { red: true, orange: true, yellow: true, green: true, blue: true, purple: true };
let adsData = {};         // { adKey: { title, desc, imgUrl, url, btnText, enabled, createdAt } }
let adCurrentIndex = 0;
let adRotationTimer = null;
let adDismissedUntil = 0; // timestamp — don't show before this
let streamers = [];

let isMasterSetupActive = false;
let vipPlayers = {};
let vipCurrentFilter = 'all';
const VIP_DURATION_MS = { 1: 86400000, 7: 7 * 86400000, 30: 30 * 86400000 };

function changeBackground() {
    const bgSelect = document.getElementById("bwType");
    if (!bgSelect) return;
    const chosenBg = bgSelect.value;
    document.body.style.backgroundImage = `url("${chosenBg}")`;
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundPosition = "center top";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundAttachment = "fixed";
    const rollScreen = document.getElementById("rollScreen");
    if (rollScreen) {
        rollScreen.style.backgroundImage = `url("${chosenBg}")`;
        rollScreen.style.backgroundRepeat = "repeat";
    }
    syncBackgroundSelector();
    updateBackgroundLibrarySelection();
}

function getBackgroundOptions() {
    const bgSelect = document.getElementById("bwType");
    if (!bgSelect) return [];
    return Array.from(bgSelect.options)
        .filter(option => option.value)
        .map(option => ({
            id: option.value,
            name: option.textContent.trim()
        }));
}

function syncBackgroundSelector() {
    const bgSelect = document.getElementById("bwType");
    const label = document.getElementById("backgroundSelectorLabel");
    if (!bgSelect || !label) return;
    const selectedOption = bgSelect.options[bgSelect.selectedIndex];
    label.textContent = selectedOption ? selectedOption.textContent.trim() : "";
}

function updateBackgroundLibrarySelection() {
    const bgSelect = document.getElementById("bwType");
    const currentName = document.getElementById("backgroundLibraryCurrentName");
    const selectedLabel = document.getElementById("backgroundLibrarySelectedLabel");
    if (!bgSelect) return;
    const selectedOption = bgSelect.options[bgSelect.selectedIndex];
    const selectedId = bgSelect.value;
    if (currentName) currentName.textContent = selectedOption ? selectedOption.textContent.trim() : "";
    if (selectedLabel) selectedLabel.textContent = selectedOption ? "Selected" : "";
    document.querySelectorAll(".background-library-card").forEach(card => {
        card.classList.toggle("selected", card.dataset.backgroundId === selectedId);
        card.setAttribute("aria-pressed", card.dataset.backgroundId === selectedId ? "true" : "false");
    });
}

function renderBackgroundLibrary() {
    const grid = document.getElementById("backgroundLibraryGrid");
    const count = document.getElementById("backgroundLibraryCount");
    if (!grid) return;
    const backgrounds = getBackgroundOptions();
    grid.innerHTML = "";
    if (count) count.textContent = `${backgrounds.length} existing backgrounds`;
    if (!backgrounds.length) {
        grid.innerHTML = '<div class="background-library-empty">No backgrounds are available.</div>';
        return;
    }
    backgrounds.forEach(background => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "background-library-card";
        card.dataset.backgroundId = background.id;
        card.setAttribute("aria-label", `Choose ${background.name}`);
        card.innerHTML = `
            <img class="background-library-thumb" src="${background.id}" alt="${background.name}">
            <span class="background-library-name"></span>
        `;
        card.querySelector(".background-library-name").textContent = background.name;
        card.addEventListener("click", () => selectBackgroundFromLibrary(background.id));
        grid.appendChild(card);
    });
    updateBackgroundLibrarySelection();
}

function openBackgroundLibrary() {
    const modal = document.getElementById("backgroundLibraryModal");
    if (!modal) return;
    renderBackgroundLibrary();
    modal.style.display = "flex";
    document.body.classList.add("background-library-open");
}

function closeBackgroundLibrary() {
    const modal = document.getElementById("backgroundLibraryModal");
    if (modal) modal.style.display = "none";
    document.body.classList.remove("background-library-open");
}

function selectBackgroundFromLibrary(backgroundId) {
    const bgSelect = document.getElementById("bwType");
    if (!bgSelect) return;
    const matchingOption = Array.from(bgSelect.options).find(option => option.value === backgroundId);
    if (!matchingOption) return;
    bgSelect.value = backgroundId;
    changeBackground();
    closeBackgroundLibrary();
}

function makeShortId() {
    let text = ""; let possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    for (let i = 0; i < 8; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
    return text;
}

function initUserSession() {
    let myId = localStorage.getItem('diceUserShortId_v2');
    if (!myId) { myId = makeShortId(); localStorage.setItem('diceUserShortId_v2', myId); }
    myGlobalShortId = myId.toUpperCase();
    document.getElementById('userIdDisplay').innerText = myGlobalShortId;
    
    // СИСТЕМА ЗА СЛЕДЕНЕ НА ХОРАТА ОНЛАЙН В РЕАЛНО ВРЕМЕ
    myPresenceRef = db.ref(`online_players/${myGlobalShortId}`);
    const connectedRef = db.ref(".info/connected");
    
    connectedRef.on("value", (snap) => {
        if (snap.val() === true) {
            setOnlinePresence();
        }
    });

    // РЕАЛЕН СЛУШАТЕЛ НА ОНЛАЙН ПОТРЕБИТЕЛИТЕ (ПРЕМАХНАТО Е +20)
    db.ref("online_players").on("value", (snap) => {
        onlinePlayers = snap.val() || {};
        const realCount = Object.values(onlinePlayers).filter(entry =>
            entry && entry.registered === true && entry.username
        ).length;
        document.getElementById("onlineCountDisplay").innerText = realCount;
        const cfOnlineVal = document.getElementById("cfOnlineVal");
        if (cfOnlineVal) cfOnlineVal.innerText = realCount;
        renderOnlinePlayersList();
    });

    db.ref(`kicked_players/${myGlobalShortId}`).on("value", (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        const kickTime = typeof data === "number" ? data : data.ts;
        if (!kickTime || kickTime < sessionStartedAt) return;
        if (myPresenceRef) myPresenceRef.remove();
        const handledKey = "egyptdice_last_kick_" + myGlobalShortId;
        if (sessionStorage.getItem(handledKey) === String(kickTime)) return;
        sessionStorage.setItem(handledKey, String(kickTime));
        alert("You have been kicked from the online players list by an administrator.");
    });
    
    db.ref('banned_users/' + myGlobalShortId).on('value', (snapshot) => {
        const banRecord = snapshot.val();
        if(isBanRecordActive(banRecord)) {
            document.getElementById("bannedIdDisplay").innerText = myGlobalShortId;
            document.getElementById("bannedReasonDisplay").innerText = `Reason: ${getBanReason(banRecord) || "No reason provided."}`;
            document.getElementById("banScreen").style.display = "flex";
            document.getElementById("mainContent").style.display = "none";
        } else {
            document.getElementById("banScreen").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
        }
    });

    db.ref('vip_players').on('value', (snapshot) => {
        vipPlayers = snapshot.val() || {};
        renderVipBanner();
        renderVipManagerList();
    });

    // СЛУШАТЕЛ ЗА GLOBAL ANNOUNCE
    db.ref('announcements/global').on('value', (snapshot) => {
        const msg = snapshot.val();
        const bar = document.getElementById("globalAnnounceBar");
        const txt = document.getElementById("globalAnnounceText");
        const shouldSpeak = announcementSpeechState.globalInitialized &&
            !!msg && msg !== announcementSpeechState.globalMessage;
        announcementSpeechState.globalMessage = msg || null;
        announcementSpeechState.globalInitialized = true;
        if(msg) {
            txt.innerText = `🚨 ${msg} 🚨`;
            bar.style.display = "block";
            if (shouldSpeak) speakAnnouncementText(msg);
        } else {
            bar.style.display = "none";
        }
    });

    // СЛУШАТЕЛ ЗА PLAYER ANNOUNCE (ЛИЧНО СЪОБЩЕНИЕ ПО ID)
    db.ref(`announcements/players/${myGlobalShortId}`).on('value', (snapshot) => {
        const msg = snapshot.val();
        const shouldSpeak = announcementSpeechState.playerInitialized &&
            !!msg && msg !== announcementSpeechState.playerMessage;
        announcementSpeechState.playerMessage = msg || null;
        announcementSpeechState.playerInitialized = true;
        if(msg) {
            document.getElementById("playerAnnounceText").innerText = msg;
            document.getElementById("playerAnnounceModal").style.display = "flex";
            if (shouldSpeak) speakAnnouncementText(msg);
        }
    });

    // JUMP SCARE LISTENER — listens for targeted jump scares sent by admin
    db.ref(`jumpscare_queue/${myGlobalShortId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            db.ref(`jumpscare_queue/${myGlobalShortId}`).remove();
            triggerJumpScare(data);
        }
    });

    updateMasterButtonUI();
    initAdminSystem();
    listenForMyPermissionUpdates();
}

function setOnlinePresence() {
    if (!myPresenceRef) return;
    if (typeof currentUser === "undefined" || !currentUser) {
        myPresenceRef.remove();
        return;
    }
    myPresenceRef.onDisconnect().remove();
    myPresenceRef.set({
        registered: true,
        playerId: myGlobalShortId,
        username: currentUser.username || myGlobalShortId,
        accountId: currentUser.accountId || "",
        avatar: currentUser.avatar || "",
        connectedAt: firebase.database.ServerValue.TIMESTAMP
    });
}

/* ---- Announcement Text-to-Speech ---- */
const announcementSpeechState = {
    globalInitialized: false,
    globalMessage: null,
    playerInitialized: false,
    playerMessage: null
};

function speakAnnouncementText(text) {
    if (!text || !('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;

    const cleanText = String(text).replace(/\s+/g, ' ').trim();
    if (!cleanText) return;

    try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const pageLanguage = document.documentElement.lang || 'en-US';
        utterance.lang = pageLanguage;
        // Bright, playful delivery without cloning or imitating any specific character.
        utterance.rate = 1.08;
        utterance.pitch = 1.58;
        utterance.volume = 1;

        const voices = window.speechSynthesis.getVoices();
        const languagePrefix = pageLanguage.toLowerCase().split('-')[0];
        const matchingVoice = voices.find(voice =>
            voice.lang && voice.lang.toLowerCase().startsWith(languagePrefix)
        );
        const expressiveVoice = voices.find(voice => {
            const name = (voice.name || '').toLowerCase();
            const sameLanguage = voice.lang && voice.lang.toLowerCase().startsWith(languagePrefix);
            return sameLanguage && /aria|ava|jenny|samantha|zira|google us english|enhanced|natural/.test(name);
        });
        if (expressiveVoice || matchingVoice) utterance.voice = expressiveVoice || matchingVoice;

        window.speechSynthesis.speak(utterance);
    } catch (error) {
        // Text-to-speech is an optional browser capability; announcement delivery remains unchanged.
        console.warn('Announcement voice playback unavailable.', error);
    }
}

// ФУНКЦИИ ЗА АДМИНИСТРИРАНЕ НА СЪОБЩЕНИЯТА
function sendGlobalAnnounce() {
    const msg = document.getElementById("admGlobalMsg").value.trim();
    if(!msg) return alert("Enter global message text!");
