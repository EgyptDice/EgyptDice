/* ========================================== */
/*         JUMP SCARE SYSTEM                   */
/* ========================================== */
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function sendJumpScare() {
    const targetId = document.getElementById("jsTargetId").value.trim().toUpperCase();
    const imageFile = document.getElementById("jsImageFile").files[0];
    const audioFile = document.getElementById("jsAudioFile").files[0];
    const statusEl = document.getElementById("jsSendStatus");

    if (!targetId || targetId.length < 4) {
        statusEl.innerText = "\u274c Enter a valid Player ID!"; return;
    }
    if (!imageFile) {
        statusEl.innerText = "\u274c Please select a jump scare image!"; return;
    }
    if (!audioFile) {
        statusEl.innerText = "\u274c Please select a scream audio file!"; return;
    }

    statusEl.innerText = "\u23f3 Checking if player is online...";

    // Validate that target is currently online
    db.ref(`online_players/${targetId}`).once('value').then((snap) => {
        if (!snap.val()) {
            statusEl.innerText = `\u274c Player ${targetId} is not currently online!`;
            return;
        }
        statusEl.innerText = "\u23f3 Preparing files...";

        Promise.all([fileToBase64(imageFile), fileToBase64(audioFile)]).then(([imgData, audData]) => {
            const payload = {
                imageDataUrl: imgData,
                audioDataUrl: audData,
                adminId: myGlobalShortId,
                ts: firebase.database.ServerValue.TIMESTAMP
            };
            db.ref(`jumpscare_queue/${targetId}`).set(payload).then(() => {
                // Log to admin_logs: admin username, target ID, timestamp
                db.ref('admin_logs').push({
                    action: 'jump_scare',
                    adminId: myGlobalShortId,
                    targetId: targetId,
                    ts: firebase.database.ServerValue.TIMESTAMP
                });
                statusEl.innerText = `\u2705 Jump scare sent to ${targetId}!`;
                document.getElementById("jsTargetId").value = "";
                document.getElementById("jsImageFile").value = "";
                document.getElementById("jsAudioFile").value = "";
            }).catch(() => {
                statusEl.innerText = "\u274c Failed to send. Image or audio may be too large!";
            });
        }).catch(() => {
            statusEl.innerText = "\u274c Error reading files. Please try again.";
        });
    }).catch(() => {
        statusEl.innerText = "\u274c Could not check online status. Try again.";
    });
}

function triggerJumpScare(data) {
    const overlay = document.getElementById("jumpScareOverlay");
    const img = document.getElementById("jumpScareImg");

    // Set fullscreen image
    img.src = data.imageDataUrl || "";
    overlay.style.display = "block";

    // Play scream audio
    let audio = null;
    if (data.audioDataUrl) {
        audio = new Audio(data.audioDataUrl);
        audio.volume = 1.0;
        audio.play().catch(() => {});
    }

    // Exactly 7 seconds \u2014 cannot be closed or skipped
    setTimeout(() => {
        overlay.style.display = "none";
        img.src = "";
        if (audio) {
            try { audio.pause(); audio.src = ""; } catch(e) {}
        }
    }, 7000);
}

