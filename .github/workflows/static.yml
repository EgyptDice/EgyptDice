    }
  }

  /* Guard: re-apply the lock every second in case the overlay was hidden via DevTools */
  setInterval(function () {
    if (!_locked) return;
    var o = document.getElementById('egyptSecOverlay');
    if (!o) return;
    if (o.style.display !== 'flex' || !o.classList.contains('sec-active')) {
      _showOverlay();
    }
  }, 1000);

  /* ─────────────────────────────────────────────────────────────────
     FIREBASE LOGGING
  ───────────────────────────────────────────────────────────────── */
  function _logSuspicious(reason) {
    try {
      if (typeof firebase !== 'undefined' && firebase.database) {
        firebase.database().ref('securityLogs').push({
          reason   : String(reason).substring(0, 200),
          sessionId: _sessionId,
          time     : new Date().toISOString(),
          ua       : (navigator.userAgent || '').substring(0, 200),
          lang     : navigator.language || '',
          url      : location.href.substring(0, 300)
        });
      }
    } catch (e) { /* never throw */ }
  }

  function _logFlip(nonce, result, serverTs) {
    try {
      if (typeof firebase !== 'undefined' && firebase.database) {
        firebase.database().ref('flipLog/' + _sessionId + '/' + nonce).set({
          result  : result,
          serverTs: serverTs || Date.now(),
          nonce   : nonce
        });
      }
    } catch (e) {}
  }

  /* ─────────────────────────────────────────────────────────────────
     DETECTION — AD-BLOCKER  (AdBlock, uBlock Origin, AdGuard …)
  ───────────────────────────────────────────────────────────────── */
  function _detectAdBlocker() {
    return new Promise(function (resolve) {
      var bait = document.createElement('div');
      bait.className = [
        'ad-banner', 'adsbox', 'doubleclick', 'ad-placement',
        'pub_300x250', 'pub_728x90', 'text-ad', 'textAd',
        'text_ad', 'text_ads', 'text-ads', 'ad-unit'
      ].join(' ');
      bait.id = 'egAdbaitEl';
      bait.setAttribute('aria-hidden', 'true');
      bait.style.cssText = 'width:1px;height:1px;position:absolute;left:-9999px;top:-9999px;pointer-events:none;';
      bait.innerHTML = '&nbsp;';
      document.body.appendChild(bait);

      setTimeout(function () {
        var blocked = false;
        try {
          var cs = window.getComputedStyle(bait);
          if (
            !document.body.contains(bait)      ||
            bait.offsetParent === null           ||
            bait.offsetHeight === 0              ||
            bait.offsetWidth  === 0              ||
            cs.display        === 'none'         ||
            cs.visibility     === 'hidden'       ||
            parseFloat(cs.opacity) < 0.05
          ) { blocked = true; }
        } catch (e) { /* ignore */ }
        try { bait.parentNode && bait.parentNode.removeChild(bait); } catch (e) {}
        resolve(blocked);
      }, 120);
    });
  }

  /* ─────────────────────────────────────────────────────────────────
     DETECTION — SCRIPT INJECTORS
     (Tampermonkey, Violentmonkey, Greasemonkey, custom injectors)
  ───────────────────────────────────────────────────────────────── */
  var INJECTOR_GLOBALS = [
    'GM_info', 'GM_setValue', 'GM_getValue', 'GM_xmlhttpRequest',
    'GM_addStyle', 'GM_deleteValue', 'GM_listValues', 'GM_log',
    'GM_notification', 'GM_openInTab', 'GM_registerMenuCommand',
    'GM_getResourceText', 'GM_getResourceURL', 'GM_download',
    'unsafeWindow', 'wrappedJSObject',
    '__tampermonkey__', '__ViolentMonkeyNativeRequest__',
    'tampermonkey', 'Tampermonkey', 'violentmonkey', 'ViolentMonkey',
    'greasemonkey', 'Greasemonkey', 'GM', 'GM4'
  ];

  function _detectScriptInjector() {
    for (var i = 0; i < INJECTOR_GLOBALS.length; i++) {
      try {
        if (typeof window[INJECTOR_GLOBALS[i]] !== 'undefined') {
          return INJECTOR_GLOBALS[i];
        }
      } catch (e) { /* property accessor may throw in some contexts */ }
    }
    return false;
  }

  /* ─────────────────────────────────────────────────────────────────
     DETECTION — INJECTED EXTERNAL SCRIPTS via MutationObserver
  ───────────────────────────────────────────────────────────────── */
  var SCRIPT_WHITELIST = [
    'firebase', 'gstatic', 'googleapis', 'egyptdice',
    'neocities', 'google-analytics', 'cloudflare',
    'raw.githubusercontent.com'
  ];

  var _scriptObserver = new MutationObserver(function (mutations) {
    if (_locked) return;
    for (var m = 0; m < mutations.length; m++) {
      var nodes = mutations[m].addedNodes;
      for (var n = 0; n < nodes.length; n++) {
        var node = nodes[n];
        if (node.nodeName !== 'SCRIPT') continue;
        var src = node.src || '';
        if (!src) continue; /* inline scripts are OK — page's own code */
        var allowed = SCRIPT_WHITELIST.some(function (w) { return src.indexOf(w) !== -1; });
        if (!allowed) {
          _lockGame('injected-script:' + src.substring(0, 80));
          return;
        }
      }
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    _scriptObserver.observe(document.documentElement, { childList: true, subtree: true });
  });

  /* ─────────────────────────────────────────────────────────────────
     DETECTION — NATIVE FUNCTION INTEGRITY
  ───────────────────────────────────────────────────────────────── */
  function _checkNativeIntegrity() {
    var fns = [Math.random, Date.now, JSON.stringify, JSON.parse];
    for (var i = 0; i < fns.length; i++) {
      try {
        var s = Function.prototype.toString.call(fns[i]);
        if (s.indexOf('[native code]') === -1) return 'native-tampered-' + i;
      } catch (e) {}
    }
    return false;
  }

  /* ─────────────────────────────────────────────────────────────────
     PROVABLY-FAIR SERVER-VALIDATED FLIP
     Commit–reveal scheme:
       1. Client commits a random clientSeed
       2. Firebase stores it with a server-side TIMESTAMP (unpredictable)
       3. Result = simple-hash(clientSeed + serverTimestamp) mod 2
       4. Neither client nor server alone controls the outcome
  ───────────────────────────────────────────────────────────────── */
  /* Pre-generated server result (loaded in background) */
  var _nextServerResult = null;
  var _loadingNext      = false;

  function _prefetchNextResult() {
    if (_loadingNext || _locked) return;
    if (typeof firebase === 'undefined' || !firebase.database) return;
    _loadingNext = true;

    var nonce      = ++_flipNonce;
    var clientSeed = Math.random().toString(36).slice(2) + Date.now().toString(36);
    var path       = 'acFlips/' + _sessionId + '/' + nonce;
    var db         = firebase.database();

    db.ref(path).set({
      clientSeed: clientSeed,
      ts        : firebase.database.ServerValue.TIMESTAMP
    }).then(function () {
      db.ref(path + '/ts').once('value').then(function (snap) {
        var serverTs = snap.val() || Date.now();
        /* Deterministic hash: clientSeed + serverTimestamp */
        var raw = clientSeed + String(serverTs);
        var h   = 5381;
        for (var i = 0; i < raw.length; i++) {
          h = (((h << 5) + h) ^ raw.charCodeAt(i)) >>> 0;
        }
        var result = (h % 2) === 0 ? 'heads' : 'tails';
        _nextServerResult = { result: result, nonce: nonce, serverTs: serverTs };
        _loadingNext = false;
      }).catch(function () { _loadingNext = false; });
    }).catch(function () { _loadingNext = false; });
  }

  /* Start prefetching once Firebase is ready */
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(_prefetchNextResult, 1500);
  });

  /* ─────────────────────────────────────────────────────────────────
     PATCH cfDoFlip — wrap original with:
       • security lock check
       • rate limit (1300 ms cooldown)
       • server-validated result via commit-reveal
  ───────────────────────────────────────────────────────────────── */
  function _patchCfDoFlip() {
    var original = window.cfDoFlip;
    if (typeof original !== 'function') return;

    window.cfDoFlip = function cfDoFlipSecure() {
      /* Hard gate */
      if (_locked) { _showOverlay(); return; }

      /* Rate-limit gate */
      var now = Date.now();
      if (now - _lastFlipMs < 1300) {
        if (now - _lastFlipMs < 800) {
          /* Rapid-fire attempt — suspicious */
          _logSuspicious('rapid-flip:' + (now - _lastFlipMs) + 'ms');
        }
        return;
      }
      _lastFlipMs = now;

      /* Use server-determined result if available, else Math.random */
      if (_nextServerResult) {
        var sr  = _nextServerResult;
        _nextServerResult = null;
        _logFlip(sr.nonce, sr.result, sr.serverTs);

        /* Temporarily steer Math.random so the original function
           picks up our server-validated outcome */
        var _origRnd = Math.random;
        Math.random = function () {
          Math.random = _origRnd; /* restore on first call */
          return sr.result === 'heads' ? 0.1 : 0.9;
        };

        original.apply(this, arguments);

        /* Prefetch the next result in the background */
        setTimeout(_prefetchNextResult, 200);
      } else {
        /* Firebase unavailable — fall through to local random,
           still log the flip */
        _logFlip(_flipNonce++, 'rng-fallback', Date.now());
        original.apply(this, arguments);
        setTimeout(_prefetchNextResult, 200);
      }
    };
  }

  /* ─────────────────────────────────────────────────────────────────
     MAIN SECURITY RUN
  ───────────────────────────────────────────────────────────────── */
  function _runChecks() {
    _startDevToolsProtection();

    /* Synchronous checks first */
    var injector = _detectScriptInjector();
    if (injector) { _lockGame('script-injector:' + injector); return; }

    var nativeIssue = _checkNativeIntegrity();
    if (nativeIssue) { _lockGame(nativeIssue); return; }

    /* Async ad-blocker check */
    _detectAdBlocker().then(function (blocked) {
      if (blocked) {
        _lockGame('adblocker-detected');
      } else {
        /* All clear — patch the flip function */
        setTimeout(_patchCfDoFlip, 300);
      }
    });
  }

  /* Periodic re-check every 4 s (catches extensions loaded late) */
  setInterval(function () {
    if (_locked) return;
    var injector = _detectScriptInjector();
    if (injector) { _lockGame('runtime-injector:' + injector); return; }
    var nativeIssue = _checkNativeIntegrity();
    if (nativeIssue) { _lockGame(nativeIssue); }
  }, 4000);

  /* ─────────────────────────────────────────────────────────────────
     READ-ONLY PROPERTY — external code can query lock state
     but cannot set it to false
  ───────────────────────────────────────────────────────────────── */
  try {
    Object.defineProperty(window, '_egyptSecLocked', {
      get          : function () { return _locked; },
      set          : function () { /* silently ignored */ },
      configurable : false,
      enumerable   : false
    });
  } catch (e) { /* defineProperty failed (old browser) — skip */ }

  /* Run after DOM is ready */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _runChecks);
  } else {
    _runChecks();
  }

})();
</script>

