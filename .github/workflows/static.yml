.vip-manager-title { font-family: Impact, sans-serif; font-size: 34px; letter-spacing: 1px; text-transform: uppercase; margin: 0; background: linear-gradient(to bottom, #f3d9ff, #c77dff 55%, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 2px 2px 0 rgba(0,0,0,0.7); }
.vip-manager-title .vip-count-pill { font-family: Arial, sans-serif; font-size: 13px; -webkit-text-fill-color: white; color: white; background: rgba(181,104,255,0.25); border: 1px solid #b568ff; padding: 3px 10px; border-radius: 20px; margin-left: 10px; vertical-align: middle; letter-spacing: 0.5px; }
.vip-manager-close { background: rgba(255,255,255,0.08); color: white; border: 2px solid #ff4d4d; font-family: Impact, sans-serif; font-size: 15px; padding: 8px 16px; border-radius: 10px; cursor: pointer; letter-spacing: 0.5px; }
.vip-manager-close:hover { background: #ff4d4d; }

.vip-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.vip-search-wrap { position: relative; flex: 1 1 220px; }
.vip-search-input { width: 100%; box-sizing: border-box; padding: 11px 14px 11px 38px; border-radius: 12px; border: 2px solid #7b2ff7; background: rgba(0,0,0,0.55); color: #f3e6ff; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
.vip-search-input::placeholder { color: #b98fe0; }
.vip-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.7; pointer-events: none; }
.vip-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.vip-filter-btn { background: rgba(255,255,255,0.06); color: #e8d4ff; border: 2px solid #6a3a99; font-family: Impact, sans-serif; font-size: 13px; letter-spacing: 0.5px; padding: 8px 14px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
.vip-filter-btn:hover { border-color: #b568ff; }
.vip-filter-btn.active { background: linear-gradient(135deg, #7b2ff7, #b568ff); color: white; border-color: #d9a6ff; box-shadow: 0 0 12px rgba(181,104,255,0.6); }
.vip-add-btn { background: linear-gradient(135deg, #00e08a, #00b36b); color: #04180f; border: 2px solid #7bffce; font-family: Impact, sans-serif; font-size: 14px; letter-spacing: 0.5px; padding: 10px 16px; border-radius: 12px; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 12px rgba(0,224,138,0.4); }
.vip-add-btn:hover { filter: brightness(1.08); }

.vip-players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 6px; }
.vip-player-card { background: linear-gradient(160deg, rgba(123,47,247,0.16), rgba(0,0,0,0.5)); border: 2px solid #6a3a99; border-radius: 16px; padding: 16px; position: relative; overflow: hidden; transition: transform 0.15s, border-color 0.15s; }
.vip-player-card:hover { transform: translateY(-2px); border-color: #b568ff; }
.vip-player-card.expired { opacity: 0.6; border-color: #7a3a3a; }
.vip-player-card.permanent { border-color: #ffcc00; box-shadow: 0 0 14px rgba(255,204,0,0.15); }
.vip-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.vip-card-username { font-family: Impact, sans-serif; font-size: 18px; color: #f3e6ff; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 155px; }
.vip-status-badge { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; padding: 4px 9px; border-radius: 20px; text-transform: uppercase; white-space: nowrap; }
.vip-status-badge.active { background: rgba(0, 255, 65, 0.18); color: #4dff8a; border: 1px solid #00ff41; }
.vip-status-badge.expired { background: rgba(255, 0, 60, 0.18); color: #ff7d95; border: 1px solid #ff003c; }
.vip-status-badge.permanent { background: rgba(255, 204, 0, 0.18); color: #ffdd57; border: 1px solid #ffcc00; }
.vip-card-id { font-family: Arial, sans-serif; font-size: 11px; color: #c9a6ea; background: rgba(255,255,255,0.06); display: inline-block; padding: 2px 8px; border-radius: 6px; margin-bottom: 10px; letter-spacing: 0.5px; }
.vip-card-row { display: flex; justify-content: space-between; font-family: Arial, sans-serif; font-size: 12px; color: #cbb8e0; margin-bottom: 5px; }
.vip-card-row b { color: #f3e6ff; font-weight: bold; }
.vip-card-actions { display: flex; gap: 8px; margin-top: 12px; }
.vip-card-actions button { flex: 1; padding: 8px; font-family: Impact, sans-serif; font-size: 13px; letter-spacing: 0.5px; border-radius: 8px; border: none; cursor: pointer; }
.vip-btn-edit { background: #3aa0ff; color: white; }
.vip-btn-edit:hover { background: #2680d9; }
.vip-btn-remove { background: #ff003c; color: white; }
.vip-btn-remove:hover { background: #cc0030; }
.vip-empty-state { text-align: center; padding: 40px 15px; color: #b98fe0; font-family: Arial, sans-serif; font-size: 14px; grid-column: 1 / -1; }

.vip-small-modal { background: radial-gradient(circle at top, #2a0a4a 0%, #120021 70%); border: 3px solid #b568ff; border-radius: 20px; width: 100%; max-width: 420px; padding: 26px; box-sizing: border-box; box-shadow: 0 0 45px rgba(181,104,255,0.5); }
.vip-small-modal h3 { margin: 0 0 18px 0; font-family: Impact, sans-serif; font-size: 26px; text-align: center; letter-spacing: 1px; text-transform: uppercase; background: linear-gradient(to bottom, #f3d9ff, #c77dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.vip-field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
.vip-field label { font-family: Impact, sans-serif; font-size: 15px; color: #e8d4ff; letter-spacing: 0.5px; }
.vip-field input[type="text"], .vip-field input[type="date"], .vip-field select { padding: 10px; font-size: 15px; border-radius: 10px; border: 2px solid #7b2ff7; background: rgba(0,0,0,0.6); color: #f3e6ff; font-weight: bold; }
.vip-field-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: Impact; font-size: 14px; color: #e8d4ff; margin-bottom: 16px; }
.vip-modal-actions { display: flex; gap: 12px; margin-top: 6px; }
.vip-modal-actions button { flex: 1; padding: 11px; font-family: Impact, sans-serif; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.5px; }
.vip-btn-save-modal { background: linear-gradient(135deg, #7b2ff7, #b568ff); color: white; }
.vip-btn-cancel-modal { background: rgba(255,255,255,0.1); color: white; border: 2px solid #666 !important; }
.vip-btn-remove-modal { background: #ff003c; color: white; width: 100%; margin-top: 10px; padding: 11px; font-family: Impact, sans-serif; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; }

@media (max-width: 600px) {
    .vip-players-grid { grid-template-columns: 1fr 1fr; }
    .vip-manager-content { padding: 18px; }
}
@media (max-width: 400px) {
    .vip-players-grid { grid-template-columns: 1fr; }
}

#banScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #500 0%, #100000 100%); z-index: 99999; align-items: center; justify-content: center; flex-direction: column; animation: pulseDanger 3s infinite alternate; }
.ban-box { text-align: center; padding: 40px; border: 6px solid #ff003c; border-radius: 30px; background: rgba(0, 0, 0, 0.9); box-shadow: 0 0 50px #ff003c; max-width: 500px; animation: banGlitch 0.3s infinite alternate; }
.ban-title { font-family: Impact, sans-serif; font-size: 65px; color: #ff003c; text-shadow: 3px 3px 0 black; margin: 0 0 10px 0; letter-spacing: 2px; }
.ban-text { font-size: 20px; font-weight: bold; color: white; margin-bottom: 20px; }
.ban-id-box { font-size: 28px; font-family: Impact; color: #ffcc00; background: #222; padding: 10px; border-radius: 10px; border: 2px dashed white; display: inline-block; }

@keyframes pulseDanger { 0% { background-color: #100000; } 100% { background-color: #3d0008; } }
@keyframes banGlitch { 0% { transform: translate(1px, 1px) rotate(0deg); } 100% { transform: translate(-1px, -1px) rotate(0.5deg); } }

/* СТИЛОВЕ ЗА ЗАЛЕПВАЩАТА ЛЕНТА */
.sticky-footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #0d0d0d;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 9998; 
    box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.6);
}

.tiktok-follow-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #fe2c55; 
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(254, 44, 85, 0.3);
    transition: background-color 0.2s, transform 0.1s;
    cursor: pointer;
}

.tiktok-follow-btn:hover { background-color: #e02247; transform: translateY(-1px); }
.tiktok-follow-btn:active { transform: translateY(1px); }
.tiktok-icon { width: 14px; height: 14px; fill: white; }

/* ── Discord follow button ── */
.discord-follow-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #5865F2;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(88, 101, 242, 0.35);
    transition: background-color 0.2s, transform 0.1s;
    cursor: pointer;
}
.discord-follow-btn:hover { background-color: #4752C4; transform: translateY(-1px); }
.discord-follow-btn:active { transform: translateY(1px); }
.discord-icon { width: 16px; height: 16px; fill: white; }

/* ── Footer social stack ── */
.footer-social-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
}

/* ── Intro social icons ── */
#introSocialIcons {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    margin-top: 22px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.45s cubic-bezier(.22,1,.36,1);
}
#introSocialIcons.show { opacity: 1; transform: translateY(0); }
.intro-social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    border-radius: 15px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), box-shadow 0.28s ease, background 0.28s ease, border-color 0.28s ease;
    will-change: transform;
}
.intro-social-icon svg {
    width: 22px;
    height: 22px;
    fill: white;
    flex-shrink: 0;
}
.intro-social-icon.tiktok-intro:hover {
    transform: scale(1.18) translateY(-4px);
    background: rgba(254,44,85,0.22);
    box-shadow: 0 10px 30px rgba(254,44,85,0.4), 0 0 20px rgba(254,44,85,0.22);
    border-color: rgba(254,44,85,0.55);
}
.intro-social-icon.discord-intro:hover {
    transform: scale(1.18) translateY(-4px);
    background: rgba(88,101,242,0.22);
    box-shadow: 0 10px 30px rgba(88,101,242,0.4), 0 0 20px rgba(88,101,242,0.22);
    border-color: rgba(88,101,242,0.55);
}
@media (max-width: 480px) {
    .intro-social-icon { width: 42px; height: 42px; border-radius: 12px; }
    .intro-social-icon svg { width: 18px; height: 18px; }
}

@media (max-width: 1000px) { 
    .main-wrapper { flex-direction: column; align-items: center; } 
    .streamers-panel { width: 100%; max-width: 700px; } 
    .sticky-footer-bar { justify-content: center; padding: 12px; } 
}

/* ======================================================= */
/*   EGYPT DICE INTRO — CINEMATIC CASINO ANIMATION         */
/* ======================================================= */

/* ── Overlay ── */
#introOverlay {
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: radial-gradient(ellipse at center, #1a1205 0%, #0d0900 55%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.9s ease;
}
#introOverlay.fade-out { opacity: 0; pointer-events: none; }

/* ── Particle canvas ── */
#introCanvas {
    position: absolute;
    inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
}

/* ── SKIP button ── */
#introSkip {
    position: absolute;
    top: 18px; right: 20px;
    font-family: Impact, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(255,220,80,0.75);
    border: 1px solid rgba(255,185,0,0.35);
    border-radius: 4px;
    padding: 5px 14px;
    cursor: pointer;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    transition: color .2s, border-color .2s, background .2s;
    z-index: 10;
    opacity: 0;
    animation: introSkipFadeIn 0.5s ease 0.8s forwards;
}
#introSkip:hover { color:#ffe066; border-color:rgba(255,204,0,.7); background:rgba(0,0,0,.6); }
@keyframes introSkipFadeIn { to { opacity: 1; } }

/* ── Central content ── */
#introContent {
    position: relative; z-index: 2;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 0;
}

/* ── Glow ring behind text ── */
#introGlowRing {
    position: absolute;
    width: clamp(220px,55vw,520px); height: clamp(220px,55vw,520px);
    border-radius: 50%;
    border: 1px solid rgba(255,185,0,.18);
    box-shadow: 0 0 80px rgba(255,185,0,.1), inset 0 0 80px rgba(255,185,0,.06);
    opacity: 0; transform: scale(0.5);
    transition: opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
    pointer-events: none; z-index: 1;
}
#introGlowRing.show { opacity:1; transform:scale(1); }

/* ── "EGYPT" ── */
#introEgypt {
    font-family: Impact, sans-serif;
    font-size: clamp(50px,11vw,108px);
    letter-spacing: clamp(6px,2vw,20px);
    background: linear-gradient(to bottom, #fff8dc 0%, #ffe066 30%, #ffb300 70%, #b8860b 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 22px rgba(255,185,0,.8)) drop-shadow(0 0 50px rgba(255,185,0,.35));
    opacity: 0; transform: translateY(-70px) scale(.88);
    transition: opacity .65s ease, transform .65s cubic-bezier(.22,1,.36,1);
    line-height: 1;
}
#introEgypt.show { opacity:1; transform:translateY(0) scale(1); }

/* ── Gold divider ── */
#introDivider {
    width: 0; height: 2px;
    background: linear-gradient(90deg,transparent,#ffe066,#ffcc00,#ffe066,transparent);
    margin: 8px auto; opacity: 0;
    box-shadow: 0 0 12px rgba(255,204,0,.7);
    transition: width .55s ease .05s, opacity .35s ease .05s;
}
#introDivider.show { width: clamp(140px,38vw,400px); opacity:1; }

/* ── "DICE" ── */
#introDiceText {
    position: relative;
    font-family: Impact, sans-serif;
    font-size: clamp(50px,11vw,108px);
    letter-spacing: clamp(16px,5vw,52px);
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,.6), 0 0 45px rgba(255,185,0,.4), 2px 2px 0 rgba(0,0,0,.85);
    opacity: 0; transform: translateY(70px) scale(.88);
    transition: opacity .65s ease, transform .65s cubic-bezier(.22,1,.36,1);
    line-height: 1;
}
#introDiceText.show { opacity:1; transform:translateY(0) scale(1); }

.vip-logo-badge {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translate(6px, -58%) scale(0.92);
    height: clamp(38px, 8vw, 78px);
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(200,150,255,.65)) drop-shadow(0 0 22px rgba(160,90,255,.4));
    opacity: 0;
    pointer-events: auto;
    transition: opacity .65s ease .1s, transform .35s cubic-bezier(.34,1.56,.64,1), filter .35s ease;
    will-change: transform, filter;
}
#introDiceText.show .vip-logo-badge {
    opacity: 1;
    transform: translate(6px, -58%) scale(1);
}
.vip-logo-badge:hover {
    transform: translate(6px, -58%) scale(1.08) rotate(-2deg);
    filter: drop-shadow(0 0 16px rgba(210,160,255,.9)) drop-shadow(0 0 34px rgba(170,100,255,.6));
}

/* Mobile: keep badge proportional and tucked closer so it never overflows the viewport */
@media (max-width: 600px) {
    .vip-logo-badge {
        height: clamp(26px, 11vw, 46px);
        transform: translate(3px, -55%) scale(0.92);
    }
    #introDiceText.show .vip-logo-badge {
        transform: translate(3px, -55%) scale(1);
    }
    .vip-logo-badge:hover {
        transform: translate(3px, -55%) scale(1.06) rotate(-2deg);
    }
}

/* ── Decorative star row ── */
#introHiero {
    font-size: clamp(11px,2vw,16px); letter-spacing: clamp(4px,2vw,14px);
    color: rgba(255,185,0,.45); margin-top: 16px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .5s ease, transform .4s ease;
    white-space: nowrap;
}
#introHiero.show { opacity:1; transform:translateY(0); }

/* ── 3-D Dice ── */
.intro-dice-stage {
    position: absolute;
    perspective: 500px;
    z-index: 3;
    opacity: 0;
    transition: opacity .6s ease;
}
.intro-dice-stage.show { opacity: 1; }

/* Die cube */
.intro-die {
    width: 56px; height: 56px;
    transform-style: preserve-3d;
    animation: none;
    will-change: transform;
}
/* Mobile: shrink dice */
@media(max-width:600px){
    .intro-die { width: 38px; height: 38px; }
    .intro-die .die-face { width:38px!important; height:38px!important; font-size:16px!important; }
    .intro-die .die-face.top    { transform: rotateX(90deg)  translateZ(19px)!important; }
    .intro-die .die-face.bottom { transform: rotateX(-90deg) translateZ(19px)!important; }
    .intro-die .die-face.front  { transform: translateZ(19px)!important; }
    .intro-die .die-face.back   { transform: rotateY(180deg) translateZ(19px)!important; }
    .intro-die .die-face.left   { transform: rotateY(-90deg) translateZ(19px)!important; }
    .intro-die .die-face.right  { transform: rotateY(90deg)  translateZ(19px)!important; }
}

/* Die face */
.die-face {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    font-weight: bold;
    backface-visibility: visible;
    border: 2px solid rgba(255,255,255,.25);
}
/* Face positions (half = 28px) */
.die-face.front  { transform: translateZ(28px); }
.die-face.back   { transform: rotateY(180deg) translateZ(28px); }
.die-face.top    { transform: rotateX(90deg)  translateZ(28px); }
.die-face.bottom { transform: rotateX(-90deg) translateZ(28px); }
.die-face.left   { transform: rotateY(-90deg) translateZ(28px); }
.die-face.right  { transform: rotateY(90deg)  translateZ(28px); }

/* Die colour themes */
.die-gold   .die-face { background: linear-gradient(145deg,#ffe066,#b8860b); color:#1a0a00; border-color:rgba(255,255,255,.35); box-shadow:inset 0 0 8px rgba(0,0,0,.3); }
.die-ivory  .die-face { background: linear-gradient(145deg,#f5f0e0,#d4c89a); color:#1a0a00; border-color:rgba(0,0,0,.2); box-shadow:inset 0 0 6px rgba(0,0,0,.2); }
.die-dark   .die-face { background: linear-gradient(145deg,#2a1f0a,#1a1205); color:#ffcc00; border-color:rgba(255,185,0,.4); box-shadow:inset 0 0 8px rgba(255,185,0,.15); }
.die-red    .die-face { background: linear-gradient(145deg,#cc2200,#8b0000); color:#fff;    border-color:rgba(255,100,100,.35); box-shadow:inset 0 0 8px rgba(0,0,0,.4); }

/* Spin animations — each die gets its own */
@keyframes spinDie1 { from{transform:rotateX(0deg)  rotateY(0deg)  rotateZ(0deg)}  to{transform:rotateX(360deg) rotateY(270deg) rotateZ(90deg)} }
@keyframes spinDie2 { from{transform:rotateX(30deg) rotateY(0deg)  rotateZ(0deg)}  to{transform:rotateX(-270deg)rotateY(360deg) rotateZ(-90deg)} }
@keyframes spinDie3 { from{transform:rotateX(0deg)  rotateY(45deg) rotateZ(0deg)}  to{transform:rotateX(270deg) rotateY(-360deg)rotateZ(180deg)} }
@keyframes spinDie4 { from{transform:rotateX(60deg) rotateY(30deg) rotateZ(0deg)}  to{transform:rotateX(-360deg)rotateY(-270deg)rotateZ(90deg)} }

/* Stage positions (4 corners around center) */
#die-tl { top: clamp(60px,12vh,130px);  left: clamp(30px,8vw,160px); }
#die-tr { top: clamp(60px,12vh,130px);  right:clamp(30px,8vw,160px); }
#die-bl { bottom:clamp(60px,12vh,130px);left: clamp(30px,8vw,160px); }
#die-br { bottom:clamp(60px,12vh,130px);right:clamp(30px,8vw,160px); }


/* ═══════════════════════════════════════════════════════════════ */
/*   EGYPT DICE — ANTI-CHEAT / SECURITY OVERLAY                   */
/* ═══════════════════════════════════════════════════════════════ */
#egyptSecOverlay {
    position: fixed;
    inset: 0;
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
