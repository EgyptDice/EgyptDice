function saveEditAdmin() {
    const id = document.getElementById('editAdminUserId').value;
    const username = document.getElementById('editAdminUsername').value.trim();
    const role = document.getElementById('editAdminRole').value;

    let permissions = {};
    if (role === 'owner') { getAllAdminPermissions().forEach(p => { permissions[p.key] = true; }); }
    else if (role === 'head_admin') { permissions = getHeadAdminPermissions(); }
    else { permissions = collectPermsFromGrid('editAdminPermsGrid'); }

    const existing = adminRoles[id] || {};
    const updated = {
        role: role,
        username: username,
        permissions: permissions,
        addedBy: existing.addedBy || myGlobalShortId,
        addedAt: existing.addedAt || firebase.database.ServerValue.TIMESTAMP,
        updatedBy: myGlobalShortId,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
    };

    db.ref('admin_roles/' + id).set(updated).then(() => {
        logAdminAction('UPDATE_ADMIN_ROLE', id, `New role: ${role}`);
