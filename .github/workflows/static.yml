}
.ad-popup-close:hover { color: #fff; background: rgba(255,50,50,0.55); }
/* image */
.ad-popup-img {
    width: 100%; max-height: 110px;
    object-fit: cover; display: block;
}
/* body */
.ad-popup-body { padding: 10px 12px 12px; }
.ad-popup-title {
    font-family: Impact, sans-serif;
    font-size: 15px; letter-spacing: 0.5px;
