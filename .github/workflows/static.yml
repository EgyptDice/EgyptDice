function rollDice(isInitialLoad = false) {
    if (!window.__egyptAuthReady || !window.__egyptAuthenticated) {
        if (window.__egyptAuthReady && typeof openAuthModal === 'function') openAuthModal('register');
        return;
    }
    if (isRolling) return;
    db.ref('banned_users/' + myGlobalShortId).once('value').then((snapshot) => {
        if(isBanRecordActive(snapshot.val())) return;
        isRolling = true;
        const count = parseInt(document.getElementById("diceCount").value);
        const rollScreen = document.getElementById("rollScreen"); const screenDiceBox = document.getElementById("screenDiceBox"); const diceBox = document.getElementById("diceBox");
        screenDiceBox.innerHTML = ""; rollScreen.style.display = "flex"; 
        for(let i=0; i<count; i++) { let sd = document.createElement("div"); sd.className = "screen-dice"; sd.innerHTML = "●"; screenDiceBox.appendChild(sd); }
        try { rollSound.currentTime = 0; rollSound.play().catch(() => {}); } catch(e) {}

        setTimeout(() => {
            rollScreen.style.display = "none"; diceBox.innerHTML = "";
            let rollColors = [];
            for (let i = 0; i < count; i++) {
                let finalColor;
                if (isInitialLoad) {
                    const baseWeights = ["orange", "yellow", "green", "purple", "red", "blue"];
                    finalColor = baseWeights[Math.floor(Math.random() * baseWeights.length)];
                } else {
                    let rand = Math.random() * 100;
                    if (rand < 5 && activeColors["yellow"]) finalColor = "yellow";
                    else if (rand < 10 && activeColors["orange"]) finalColor = "orange";
                    else {
                        let mainPool = ["red", "green", "blue", "purple"]
                            .filter(c => activeColors[c]);
                        // Fallback: if all main colors are disabled, use any active color
                        if (mainPool.length === 0) mainPool = ["red", "green", "blue", "purple"].filter(c => activeColors[c]);
                        if (mainPool.length === 0) mainPool = ["red", "green", "blue", "purple"];
                        finalColor = mainPool[Math.floor(Math.random() * mainPool.length)];
                    }
                }
                rollColors.push(finalColor);
            }

            rollColors.forEach(color => {
                const d = document.createElement("div"); d.className = "dice"; d.style.background = color; d.innerHTML = "●"; diceBox.appendChild(d);
                if (!isInitialLoad) colorCounts[color]++;
            });

            if (!isInitialLoad) {
                let currentRollStreaks = {}; rollColors.forEach(c => { currentRollStreaks[c] = (currentRollStreaks[c] || 0) + 1; });
                for (let c in currentRollStreaks) { if (currentRollStreaks[c] > longestStreak.count) { longestStreak.count = currentRollStreaks[c]; longestStreak.color = c; } }
                updateStatsDisplay(); history.push([...rollColors]); if (history.length > 10) history.shift(); updateHistoryDisplay();
                recordAccountRoll(rollColors);
            }
            if (myGlobalShortId) { db.ref('player_data/' + myGlobalShortId).set({ currentRoll: rollColors, history: history }); }
            isRolling = false;
        }, 800);
    });
}


/* ============================================================
   ADVERTISEMENT MANAGEMENT SYSTEM
   Firebase path: advertisements/{key}
   Structure: { title, desc, imgUrl, url, btnText, enabled, createdAt }
   ============================================================ */

/* ---- Ad Popup: display logic ---- */
function getEnabledAds() {
    return Object.entries(adsData)
        .filter(([k, v]) => v && v.enabled)
        .map(([k, v]) => ({ key: k, ...v }));
}

let adPopupOpen = false;

/* Toggle popup open/close when user clicks "Paid Ads" */
function toggleAdPopup() {
    if (adPopupOpen) { closeAdPopup(); } else { openAdPopup(); }
}

function openAdPopup() {
    const ads = getEnabledAds();
    const widget = document.getElementById('adWidget');
    if (!widget) return;
    if (!ads.length) {
        widget.innerHTML = '<div class="ad-popup-card"><div class="ad-popup-header"><span class="ad-popup-label">Advertisements</span><button class="ad-popup-close" onclick="closeAdPopup()">&times;</button></div><div class="ad-popup-body" style="text-align:center;padding:20px 12px;font-family:Arial;font-size:13px;color:rgba(255,255,255,0.4);">No active ads at the moment.</div></div>';
        widget.style.display = 'block';
        adPopupOpen = true;
        return;
    }
    renderAdPopup(ads, adCurrentIndex);
    widget.style.display = 'block';
    adPopupOpen = true;

    /* rotate every 60 s while popup is open */
    if (adRotationTimer) clearInterval(adRotationTimer);
    if (ads.length > 1) {
        adRotationTimer = setInterval(() => {
            if (!adPopupOpen) return;
            const current = getEnabledAds();
            if (!current.length) return;
            adCurrentIndex = (adCurrentIndex + 1) % current.length;
            renderAdPopup(current, adCurrentIndex);
        }, 60000);
    }
}

function closeAdPopup() {
    const widget = document.getElementById('adWidget');
    if (widget) widget.style.display = 'none';
    adPopupOpen = false;
    if (adRotationTimer) { clearInterval(adRotationTimer); adRotationTimer = null; }
}

function jumpToAd(idx) {
    const ads = getEnabledAds();
    if (!ads.length) return;
    adCurrentIndex = idx % ads.length;
    renderAdPopup(ads, adCurrentIndex);
}

function renderAdPopup(ads, idx) {
    const widget = document.getElementById('adWidget');
    if (!widget) return;
    const ad = ads[idx];
    if (!ad) return;

    const dotsHtml = ads.length > 1
        ? `<div class="ad-popup-dots">${ads.map((a, i) =>
            `<span class="ad-popup-dot${i === idx ? ' active' : ''}" onclick="jumpToAd(${i})"></span>`
          ).join('')}</div>`
        : '';

    widget.innerHTML = `<div class="ad-popup-card">
        <div class="ad-popup-header">
            <span class="ad-popup-label">Advertisement${ads.length > 1 ? ' ' + (idx+1) + '/' + ads.length : ''}</span>
            <button class="ad-popup-close" onclick="closeAdPopup()" title="Close">&times;</button>
        </div>
        ${ad.imgUrl ? `<img class="ad-popup-img" src="${escAd(ad.imgUrl)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="ad-popup-body">
            <div class="ad-popup-title">${escAd(ad.title || '')}</div>
            ${ad.desc ? `<div class="ad-popup-desc">${escAd(ad.desc)}</div>` : ''}
            ${ad.url ? `<a class="ad-popup-cta" href="${escAd(ad.url)}" target="_blank" rel="noopener">${escAd(ad.btnText || 'Visit Site')}</a>` : ''}
            ${dotsHtml}
        </div>
    </div>`;
}

/* Called whenever adsData updates from Firebase — just keep index in range */
function startAdRotation() {
    const ads = getEnabledAds();
    if (adCurrentIndex >= ads.length) adCurrentIndex = 0;
    /* If popup is already open, refresh it with latest data */
    if (adPopupOpen && ads.length) renderAdPopup(ads, adCurrentIndex);
    if (adPopupOpen && !ads.length) openAdPopup(); /* show "no ads" state */
}

function escAd(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(str || '')));
    return d.innerHTML;
}

