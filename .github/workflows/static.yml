function renderAdManagerList() {
    const container = document.getElementById('adCardsContainer');
    if (!container) return;
    const pill = document.getElementById('adCountPill');
    const entries = Object.entries(adsData);
    if (pill) pill.textContent = entries.length + (entries.length === 1 ? ' ad' : ' ads');

    if (!entries.length) {
        container.innerHTML = '<div class="ad-cards-empty">No advertisements yet.<br>Click &ldquo;CREATE NEW AD&rdquo; to add one.</div>';
        return;
    }

    container.innerHTML = entries.map(([key, ad]) => {
        const isEnabled = !!ad.enabled;
        const thumbHtml = ad.imgUrl
            ? `<div class="ad-card-thumb-wrap"><img class="ad-card-thumb" src="${escAd(ad.imgUrl)}" alt="" onerror="this.parentNode.style.display='none'"></div>`
            : `<div class="ad-card-thumb-wrap" style="display:flex;align-items:center;justify-content:center;"><span style="font-size:28px;opacity:.3;">🖼️</span></div>`;
        return `<div class="ad-card${isEnabled ? '' : ' disabled-ad'}">
            ${thumbHtml}
            <div class="ad-card-title">${escAd(ad.title || '(No title)')}</div>
            <div class="ad-card-url">${escAd(ad.url || '')}</div>
            <span class="ad-card-status ${isEnabled ? 'enabled' : 'disabled'}">${isEnabled ? '🟢 ENABLED' : '🔴 DISABLED'}</span>
            <div class="ad-card-actions">
                <button class="btn-ad-edit" onclick="openAdEditModal('${escAd(key)}')">✏️ Edit</button>
                <button class="${isEnabled ? 'btn-ad-toggle-off' : 'btn-ad-toggle-on'}" onclick="toggleAd('${escAd(key)}', ${isEnabled})">${isEnabled ? 'Disable' : 'Enable'}</button>
                <button class="btn-ad-delete" onclick="deleteAd('${escAd(key)}')">🗑️</button>
            </div>
        </div>`;
    }).join('');
}

/* ---- Ad Create/Edit Modal ---- */
let _adEditListeners = [];
function openAdEditModal(key) {
    const modal = document.getElementById('adEditModal');
    modal.style.display = 'flex';
    document.getElementById('adEditKey').value = key || '';
    document.getElementById('adEditModalTitle').textContent = key ? 'EDIT AD' : 'CREATE AD';

    const ad = key && adsData[key] ? adsData[key] : {};
    document.getElementById('adEditTitle').value   = ad.title   || '';
    document.getElementById('adEditDesc').value    = ad.desc    || '';
    document.getElementById('adEditImg').value     = ad.imgUrl  || '';
    document.getElementById('adEditUrl').value     = ad.url     || '';
    document.getElementById('adEditBtnText').value = ad.btnText || 'Visit Site';
    document.getElementById('adEditEnabled').checked = ad.enabled !== false;

    updateAdPreview();

    // Live preview listeners
    _adEditListeners.forEach(([el, fn]) => el.removeEventListener('input', fn));
    _adEditListeners = [];
    ['adEditTitle','adEditDesc','adEditImg','adEditUrl','adEditBtnText'].forEach(id => {
        const el = document.getElementById(id);
        const fn = () => updateAdPreview();
        el.addEventListener('input', fn);
        _adEditListeners.push([el, fn]);
    });
    document.getElementById('adEditEnabled').addEventListener('change', updateAdPreview);
}
function closeAdEditModal() {
    document.getElementById('adEditModal').style.display = 'none';
}

function updateAdPreview() {
    const preview = document.getElementById('adInlinePreview');
    if (!preview) return;
    const title   = document.getElementById('adEditTitle').value || 'Ad Title';
    const desc    = document.getElementById('adEditDesc').value;
    const imgUrl  = document.getElementById('adEditImg').value;
    const url     = document.getElementById('adEditUrl').value;
    const btnText = document.getElementById('adEditBtnText').value || 'Visit Site';

    preview.innerHTML = `
        <div style="background:linear-gradient(145deg,rgba(20,15,35,.97),rgba(10,8,20,.99));border:1px solid rgba(255,204,0,.28);border-radius:14px;overflow:hidden;max-width:240px;box-shadow:0 8px 32px rgba(0,0,0,.7);">
            ${imgUrl ? `<img src="${escAd(imgUrl)}" style="width:100%;max-height:100px;object-fit:cover;display:block;" onerror="this.style.display='none'">` : ''}
            <div style="padding:10px 12px 12px;">
                <div style="font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.2px;color:rgba(255,204,0,.5);text-transform:uppercase;margin-bottom:4px;">Advertisement</div>
                <div style="font-family:Impact,sans-serif;font-size:14px;color:#ffe066;margin-bottom:3px;">${escAd(title)}</div>
                ${desc ? `<div style="font-family:Arial,sans-serif;font-size:11px;color:rgba(255,255,255,.6);line-height:1.4;margin-bottom:8px;">${escAd(desc)}</div>` : ''}
                ${url ? `<span style="display:inline-block;padding:6px 12px;background:linear-gradient(135deg,#b8860b,#ffe066);color:#1a0e00;font-family:Impact,sans-serif;font-size:12px;border-radius:7px;">${escAd(btnText)}</span>` : ''}
            </div>
        </div>`;
}

function saveAdFromModal() {
    const key      = document.getElementById('adEditKey').value.trim();
    const title    = document.getElementById('adEditTitle').value.trim();
    const desc     = document.getElementById('adEditDesc').value.trim();
    const imgUrl   = document.getElementById('adEditImg').value.trim();
    const url      = document.getElementById('adEditUrl').value.trim();
    const btnText  = document.getElementById('adEditBtnText').value.trim();
    const enabled  = document.getElementById('adEditEnabled').checked;

    if (!title) { alert('Please enter an Ad Title!'); return; }
    if (!url)   { alert('Please enter a Website URL!'); return; }

    const entry = {
        title, desc, imgUrl, url,
        btnText: btnText || 'Visit Site',
        enabled,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
    };

    if (key) {
        // Edit existing
        const existing = adsData[key] || {};
        entry.createdAt = existing.createdAt || firebase.database.ServerValue.TIMESTAMP;
        db.ref('advertisements/' + key).set(entry).then(() => {
            logAdminAction('AD_UPDATED', '', `Ad: "${title}" | Enabled: ${enabled}`);
            closeAdEditModal();
            alert('Advertisement updated!');
        });
    } else {
        // Create new
        entry.createdAt = firebase.database.ServerValue.TIMESTAMP;
        db.ref('advertisements').push(entry).then(() => {
            logAdminAction('AD_CREATED', '', `Ad: "${title}" | Enabled: ${enabled}`);
            closeAdEditModal();
            alert('Advertisement created!');
        });
    }
}

function toggleAd(key, currentlyEnabled) {
    const ad = adsData[key];
    if (!ad) return;
    const newEnabled = !currentlyEnabled;
    db.ref('advertisements/' + key + '/enabled').set(newEnabled).then(() => {
        logAdminAction(newEnabled ? 'AD_ENABLED' : 'AD_DISABLED', '', `Ad: "${ad.title || key}"`);
    });
}

function deleteAd(key) {
    const ad = adsData[key];
    if (!ad) return;
    if (!confirm(`Delete ad "${ad.title || key}"? This cannot be undone.`)) return;
    db.ref('advertisements/' + key).remove().then(() => {
        logAdminAction('AD_DELETED', '', `Ad: "${ad.title || key}"`);
        alert('Advertisement deleted.');
    });
}

