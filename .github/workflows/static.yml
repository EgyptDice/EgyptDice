.btn-save { background: #b8860b; color: white; border: 2px solid white; }
.btn-close { background: #ff4d4d; color: white; border: 2px solid white; }

.verify-result-box { margin-top: 25px; background: rgba(0,0,0,0.85); border: 3px solid white; border-radius: 15px; padding: 20px; display: none; }
.verify-result-title { font-family: Impact; font-size: 22px; margin-bottom: 12px; color: #ffe066; text-transform: uppercase; text-align: center; }
.verify-dice-result { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 25px; }
.verify-history-title { font-family: Impact; font-size: 22px; margin-bottom: 15px; color: white; text-transform: uppercase; text-align: center; border-top: 2px dashed rgba(255,255,255,0.3); padding-top: 15px; }
.verify-history-list { display: flex; flex-direction: column; gap: 12px; }

/* ========================================== */
/*   VERIFY PLAYER — REFINED POPUP             */
/*   Scoped to #verifyModal so admin UI stays  */
/*   unchanged.                                */
/* ========================================== */
#verifyModal {
    padding: clamp(14px, 3vw, 28px);
    box-sizing: border-box;
    background: rgba(4, 8, 18, 0.78);
    backdrop-filter: blur(10px) saturate(115%);
    -webkit-backdrop-filter: blur(10px) saturate(115%);
    animation: verifyBackdropIn 0.24s ease-out both;
}

#verifyModal .verify-content {
    position: relative;
    isolation: isolate;
    width: min(100%, 510px);
    max-width: 510px;
    max-height: min(88vh, 720px);
    overflow-x: hidden;
    overflow-y: auto;
    padding: clamp(24px, 5vw, 38px);
    border: 1px solid rgba(255, 224, 102, 0.34);
    border-radius: 24px;
    background:
        radial-gradient(circle at 100% 0%, rgba(58, 160, 255, 0.15), transparent 38%),
        radial-gradient(circle at 0% 100%, rgba(255, 184, 0, 0.1), transparent 42%),
        linear-gradient(145deg, rgba(17, 25, 45, 0.98), rgba(7, 12, 25, 0.99));
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 24px 80px rgba(0, 0, 0, 0.62),
        0 0 42px rgba(255, 196, 54, 0.11);
    animation: verifyWindowIn 0.42s cubic-bezier(.2, .8, .2, 1.05) both;
}

#verifyModal .verify-content::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 224, 102, 0.9), transparent);
    box-shadow: 0 0 18px rgba(255, 224, 102, 0.5);
}

#verifyModal .verify-content::-webkit-scrollbar { width: 7px; }
#verifyModal .verify-content::-webkit-scrollbar-track { background: transparent; }
#verifyModal .verify-content::-webkit-scrollbar-thumb {
    border-radius: 10px;
    background: rgba(255, 224, 102, 0.32);
}

#verifyModal .verify-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 14px;
}

#verifyModal .verify-mark {
    display: grid;
    flex: 0 0 48px;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255, 224, 102, 0.48);
    border-radius: 15px;
    background: linear-gradient(145deg, rgba(255, 224, 102, 0.2), rgba(255, 177, 0, 0.07));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 24px rgba(255, 187, 0, 0.1);
    color: #ffe066;
    font: 700 24px/1 Arial, sans-serif;
}

#verifyModal .verify-heading-copy { min-width: 0; }
#verifyModal .verify-kicker {
    margin: 0 0 5px;
    color: rgba(255, 224, 102, 0.72);
    font: 700 10px/1.2 Arial, sans-serif;
    letter-spacing: 2px;
}

#verifyModal .verify-content h2 {
    margin: 0;
    color: #fff6cb;
    background: linear-gradient(135deg, #fff8cf 0%, #ffe066 52%, #ffb300 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font: 700 clamp(28px, 5vw, 36px)/1.05 Arial, sans-serif;
    letter-spacing: -0.8px;
    text-align: left;
    text-transform: none;
    text-shadow: 0 4px 24px rgba(255, 186, 0, 0.18);
}

#verifyModal .verify-intro {
    max-width: 410px;
    margin: 0 0 24px 63px;
    color: rgba(239, 244, 255, 0.72);
    font: 14px/1.6 Arial, sans-serif;
}

#verifyModal .verify-divider {
    height: 1px;
    margin: 0 0 24px;
    background: linear-gradient(90deg, rgba(255, 224, 102, 0.34), rgba(255, 255, 255, 0.06), transparent);
}

#verifyModal .verify-field {
    margin-bottom: 0;
    gap: 9px;
}

#verifyModal .verify-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

#verifyModal .verify-field label {
    color: #eef3ff;
    font: 700 13px/1.3 Arial, sans-serif;
    letter-spacing: 0.2px;
}

#verifyModal .verify-required {
    color: rgba(255, 224, 102, 0.68);
    font: 700 9px/1 Arial, sans-serif;
    letter-spacing: 1.2px;
}

#verifyModal .verify-input-wrap {
    display: flex;
    align-items: center;
    min-height: 54px;
    border: 1px solid rgba(154, 180, 224, 0.25);
    border-radius: 14px;
    background: rgba(3, 8, 19, 0.72);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

#verifyModal .verify-input-wrap:focus-within {
    border-color: rgba(255, 224, 102, 0.78);
    background: rgba(5, 12, 28, 0.9);
    box-shadow: 0 0 0 4px rgba(255, 224, 102, 0.1), 0 8px 24px rgba(0, 0, 0, 0.18);
}

#verifyModal .verify-input-prefix {
    padding: 0 15px;
    border-right: 1px solid rgba(154, 180, 224, 0.2);
    color: rgba(255, 224, 102, 0.72);
    font: 700 11px/1 Arial, sans-serif;
    letter-spacing: 1px;
}

#verifyModal .verify-field input[type="text"] {
    width: 100%;
    min-width: 0;
    padding: 15px 16px;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff6cb;
    font: 700 18px/1.2 Arial, sans-serif;
    letter-spacing: 2px;
    text-align: left;
    text-transform: uppercase;
}

#verifyModal .verify-field input[type="text"]::placeholder {
    color: rgba(215, 226, 247, 0.34);
    letter-spacing: 1px;
}

#verifyModal .verify-helper {
    margin: 1px 0 0;
    color: rgba(215, 226, 247, 0.48);
    font: 12px/1.5 Arial, sans-serif;
}

#verifyModal .verify-actions {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.8fr);
    gap: 10px;
    margin-top: 28px;
}

#verifyModal .verify-btn {
    min-height: 50px;
    padding: 13px 16px;
    border: 1px solid transparent;
    border-radius: 13px;
    cursor: pointer;
    font: 700 12px/1 Arial, sans-serif;
    letter-spacing: 1.1px;
    transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

#verifyModal .verify-btn:focus-visible {
    outline: 3px solid rgba(255, 224, 102, 0.38);
    outline-offset: 3px;
}

#verifyModal .verify-actions .btn-save {
    border-color: rgba(255, 238, 161, 0.62);
    background: linear-gradient(135deg, #ffe98a 0%, #ffc53d 48%, #e99a00 100%);
    color: #211800;
    box-shadow: 0 10px 24px rgba(226, 157, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.48);
}

#verifyModal .verify-actions .btn-save:hover {
    filter: brightness(1.08) saturate(1.08);
    box-shadow: 0 13px 30px rgba(226, 157, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.58);
    transform: translateY(-2px);
}

#verifyModal .verify-actions .btn-save:active {
    filter: brightness(0.98);
    transform: translateY(1px) scale(0.985);
}

#verifyModal .verify-actions .btn-close {
    border-color: rgba(180, 199, 232, 0.24);
    background: rgba(255, 255, 255, 0.06);
    color: rgba(239, 244, 255, 0.76);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

#verifyModal .verify-actions .btn-close:hover {
    border-color: rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.11);
    color: #fff;
    transform: translateY(-2px);
}

#verifyModal .verify-actions .btn-close:active { transform: translateY(1px) scale(0.985); }

#verifyModal .verify-result-box {
    margin-top: 26px;
    padding: 18px;
    border: 1px solid rgba(108, 193, 255, 0.25);
    border-radius: 17px;
    background: rgba(2, 7, 18, 0.72);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: verifyResultIn 0.3s ease-out both;
}

#verifyModal .verify-result-title {
    margin-bottom: 14px;
    color: #ffe066;
    font: 700 11px/1.2 Arial, sans-serif;
    letter-spacing: 1.4px;
}

#verifyModal .verify-dice-result {
    gap: 10px;
    margin-bottom: 20px;
}

#verifyModal .verify-dice-result .mini-dice {
    border: 1px solid rgba(255, 255, 255, 0.84);
    border-radius: 11px !important;
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.28);
}

#verifyModal .verify-history-title {
    margin-bottom: 13px;
    padding-top: 16px;
    border-top: 1px solid rgba(169, 191, 225, 0.16);
    color: rgba(239, 244, 255, 0.78);
    font: 700 11px/1.2 Arial, sans-serif;
    letter-spacing: 1.3px;
}

#verifyModal .verify-history-list { gap: 10px; }
#verifyModal .verify-history-list .history-row {
    gap: 12px;
    min-height: 42px;
    padding: 5px 0;
}
#verifyModal .verify-history-list .history-row::after {
    bottom: -5px;
    left: 32px;
    width: calc(100% - 32px);
    border-bottom-color: rgba(169, 191, 225, 0.12);
}
#verifyModal .verify-history-list .history-row-number {
    width: 20px;
    color: rgba(255, 224, 102, 0.62);
    font: 700 11px/1 Arial, sans-serif;
}
#verifyModal .verify-history-list .history-dice-group { gap: 7px; }
#verifyModal .verify-history-list .mini-dice {
    width: 32px !important;
    height: 32px !important;
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 9px;
    font-size: 16px !important;
}

@keyframes verifyBackdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes verifyWindowIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes verifyResultIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 520px) {
    #verifyModal .verify-content {
        border-radius: 20px;
        padding: 24px 20px;
    }
    #verifyModal .verify-intro {
        margin-left: 0;
    }
}

@media (max-width: 380px) {
    #verifyModal .verify-header { gap: 11px; }
    #verifyModal .verify-mark {
        flex-basis: 42px;
        width: 42px;
        height: 42px;
        border-radius: 13px;
    }
    #verifyModal .verify-actions { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
    #verifyModal,
    #verifyModal .verify-content,
    #verifyModal .verify-result-box {
        animation: none;
    }
    #verifyModal .verify-btn,
    #verifyModal .verify-input-wrap {
        transition: none;
    }
}

