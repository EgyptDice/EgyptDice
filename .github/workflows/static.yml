    animation: adPopupIn 0.28s cubic-bezier(.22,.68,0,1.2);
}
@keyframes adPopupIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
}
/* header strip */
.ad-popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
